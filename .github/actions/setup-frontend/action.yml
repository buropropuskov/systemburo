name: Setup Frontend
description: Setup Node.js with npm cache and install frontend dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      shell: bash
      working-directory: frontend
      run: npm ci
