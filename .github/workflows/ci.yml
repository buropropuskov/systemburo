name: CI

on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [prod, dev]

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        run: |
          PATTERN="^(fix|feat|feature|refactor|docs|test|chore|style|build|ci|perf)(\(.+\))?: .{3,}"
          git log --format="%s" --no-merges origin/${{ github.base_ref }}..HEAD | while read -r msg; do
            if ! echo "$msg" | grep -qE "$PATTERN"; then
              echo "❌ $msg"
              echo "   Формат: prefix(scope): описание"
              exit 1
            fi
            echo "✅ $msg"
          done

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auto_registry_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://postgres:testpass@localhost:5432/auto_registry
      DATABASE_URL_TEST: postgres://postgres:testpass@localhost:5432/auto_registry_test
      JWT_SECRET: ci-test-jwt-secret-that-is-at-least-32-chars!!
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-at-least-32-chars!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download dependencies
        run: go mod download
      - name: Run go vet
        run: go vet ./...
      - name: Run tests
        run: go test ./... -v -race -count=1 -timeout 120s

  frontend-lint:
    name: Frontend Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:run

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [go-test, frontend-lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auto_registry
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://postgres:testpass@localhost:5432/auto_registry
      JWT_SECRET: ci-test-jwt-secret-that-is-at-least-32-chars!!
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-at-least-32-chars!
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:8081"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build and start backend
        run: |
          go build -o server ./cmd/server
          ./server &
          for i in $(seq 1 30); do
            curl -s http://localhost:8080/health && break
            sleep 1
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start frontend dev server
        working-directory: frontend
        run: |
          VITE_API_BASE_URL=http://localhost:8080 npx vite --port 8081 &
          for i in $(seq 1 30); do
            curl -s http://localhost:8081 && break
            sleep 1
          done

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [go-test, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend production image
        run: docker build --target production -t systemburo:ci .
      - name: Build frontend production image
        run: docker build --target production -t systemburo-frontend:ci ./frontend
      - name: Verify backend image
        run: docker run --rm systemburo:ci id
