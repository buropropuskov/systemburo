name: CI

on:
  push:
    branches: [prod, staging, dev]
  pull_request:
    branches: [prod, staging]

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auto_registry_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://postgres:testpass@localhost:5432/auto_registry
      DATABASE_URL_TEST: postgres://postgres:testpass@localhost:5432/auto_registry_test
      JWT_SECRET: ci-test-jwt-secret-that-is-at-least-32-chars!!
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-at-least-32-chars!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download dependencies
        run: go mod download
      - name: Run go vet
        run: go vet ./...
      - name: Run tests
        run: go test ./... -v -race -count=1 -timeout 120s

  frontend-lint:
    name: Frontend Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:run

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [go-test, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend production image
        run: docker build --target production -t systemburo:ci .
      - name: Build frontend production image
        run: docker build --target production -t systemburo-frontend:ci ./frontend
      - name: Verify backend image
        run: docker run --rm systemburo:ci id
