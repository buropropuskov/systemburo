name: CI

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
    branches: [dev, prod]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  paths:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'cmd/**'
              - 'internal/**'
              - 'docs/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              # Перечень сторонних компонентов стерегут два замка - Go-тест и
              # спека фронта. Без этой строки правка одного лишь перечня не
              # запускала ни одного из них: убрать из него строку и слить зелёным
              # было бы можно.
              - 'THIRD-PARTY-NOTICES.md'
            frontend:
              - 'frontend/**'
              - 'THIRD-PARTY-NOTICES.md'
            infra:
              - 'docker-compose*.yml'
              - 'nginx/**'
              - 'postgres/**'
              - 'pgadmin/**'
              - 'scripts/**'
              - 'Makefile'
            workflows:
              - '.github/**'

  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate commit messages
        run: |
          PATTERN="^(fix|feat|feature|refactor|docs|test|chore|style|build|ci|perf)(\(.+\))?: .{3,}"
          git log --format="%s" --no-merges origin/${{ github.base_ref }}..HEAD | while read -r msg; do
            if ! echo "$msg" | grep -qE "$PATTERN"; then
              echo "❌ $msg"
              echo "   Формат: prefix(scope): описание"
              exit 1
            fi
            echo "✅ $msg"
          done

  backend-vet:
    name: Go Vet
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.backend == 'true' || needs.paths.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - run: go vet ./...

  backend-test-groups:
    name: Go Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: [paths, backend-vet]
    if: needs.paths.outputs.backend == 'true' || needs.paths.outputs.workflows == 'true'
    strategy:
      fail-fast: false
      matrix:
        group: [handlers-1, handlers-2, services-1, services-2, other]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auto_registry_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://postgres:testpass@localhost:5432/auto_registry
      DATABASE_URL_TEST: postgres://postgres:testpass@localhost:5432/auto_registry_test
      JWT_SECRET: ci-test-jwt-secret-that-is-at-least-32-chars!!
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-at-least-32-chars!
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Check test grouping
        run: python3 -m unittest discover -s .github/scripts -p 'test_go_test_groups.py'
      - name: Run tests
        # Each matrix job owns its PostgreSQL. Keep race detection and the
        # existing 1000s limit; verify the complete inventory and executed names.
        run: python3 .github/scripts/go_test_groups.py '${{ matrix.group }}'

  backend-test:
    # Preserve the existing required check and downstream dependency name.
    name: Go Tests
    runs-on: ubuntu-latest
    needs: [paths, backend-vet, backend-test-groups]
    if: always() && (needs.paths.outputs.backend == 'true' || needs.paths.outputs.workflows == 'true')
    steps:
      - name: Require all Go test groups
        env:
          GROUPS_RESULT: ${{ needs.backend-test-groups.result }}
        run: test "$GROUPS_RESULT" = success

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.frontend == 'true' || needs.paths.outputs.workflows == 'true'
    steps:
      # Полная история нужна проверке размеров: она сравнивает файлы с общим
      # предком ветки и dev, а не с зафиксированным снимком.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-frontend
      - working-directory: frontend
        run: npm run lint
      # Храповик на размер файлов: новый файл обязан уложиться в порог, а файл,
      # который уже сверх порога, не может вырасти дальше. Порог опускается по
      # мере распила мега-компонентов.
      - working-directory: frontend
        run: npm run lint:size
      # Внутренние отступы окон: BaseModal отбивает шапку и кнопки, а тело
      # оставляет на нуле. Окно без своего отступа прижимает текст к рамке -
      # ловилось только глазами на экране.
      - working-directory: frontend
        run: npm run lint:modal

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [paths, frontend-lint]
    if: needs.paths.outputs.frontend == 'true' || needs.paths.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - working-directory: frontend
        run: npm run test:run

  frontend-bundle:
    name: Frontend Bundle Budget
    runs-on: ubuntu-latest
    needs: [paths, frontend-lint]
    if: needs.paths.outputs.frontend == 'true' || needs.paths.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      # Считаем цену открытия страницы логина: точка входа, modulepreload и
      # стили из dist/index.html. Ленивые чанки роутов в бюджет не входят.
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm run lint:bundle

  release-policy-tests:
    name: Release Policy Tests
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Check exact-SHA release gates
        run: python3 -m unittest discover -s .github/scripts -p 'test_wait_release_checks.py'

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [paths, backend-test, frontend-lint, frontend-test, frontend-bundle, release-policy-tests]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # GHCR: публикуем только просканированные dev/prod образы.
      # Для PR/manual builds логин пропускаем - в этих случаях push: false.
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase repo for ghcr.io
        id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      # Backend, как и frontend ниже, уезжает в ghcr.io и деплоится через pull.
      # Раньше готовый образ здесь выбрасывался, а VPS собирал его заново пять
      # минут: go install swag, go mod download и компиляция двух бинарей на
      # слабом CPU. Публикуем после проверки на non-root, а не одним шагом с
      # ней - в реестр не должен попасть образ, который её не прошёл.
      - name: Build backend image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          no-cache-filters: production
          tags: |
            systemburo:ci
            ghcr.io/${{ steps.repo.outputs.lower }}-backend:${{ github.sha }}
          load: true
          cache-from: type=gha,scope=systemburo-backend
          cache-to: type=gha,mode=max,scope=systemburo-backend
      # Frontend image пушим в ghcr.io для деплоя - на слабом VPS Jino
      # npm ci + vite build занимали 30+ минут (I/O bottleneck linking
      # node_modules). На GA runner это <2 минут, и deploy на VPS
      # сводится к docker pull (~30s) + up. Тэгируем SHA для воспроизводимости
      # + dev для последнего.
      - name: Build frontend image (cached)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: production
          no-cache-filters: production
          load: true
          tags: |
            systemburo-frontend:ci
            ghcr.io/${{ steps.repo.outputs.lower }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=systemburo-frontend
          cache-to: type=gha,mode=max,scope=systemburo-frontend
      # Временно доставляем staging-nginx готовым образом вместе с сервисами.
      # Используем прежний Dockerfile; публикуем только после smoke-проверки.
      - name: Build staging nginx image (cached)
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          file: ./nginx/Dockerfile.staging
          target: staging
          no-cache-filters: production,staging
          tags: |
            systemburo-nginx:ci
            ghcr.io/${{ steps.repo.outputs.lower }}-nginx:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=systemburo-staging-nginx
          cache-to: type=gha,mode=max,scope=systemburo-staging-nginx
      - name: Verify staging nginx has OpenSSL
        run: docker run --rm --entrypoint openssl systemburo-nginx:ci version
      - name: Build production nginx image (cached dependencies, fresh runtime)
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          file: ./nginx/Dockerfile.staging
          target: production
          no-cache-filters: production
          tags: |
            systemburo-nginx-prod:ci
            ghcr.io/${{ steps.repo.outputs.lower }}-nginx-prod:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=systemburo-production-nginx
          cache-to: type=gha,mode=max,scope=systemburo-production-nginx
      - name: Build PostgreSQL runtime with pinned gosu
        uses: docker/build-push-action@v7
        with:
          context: ./postgres
          target: production
          tags: |
            systemburo-postgres:ci
            ghcr.io/${{ steps.repo.outputs.lower }}-postgres:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=systemburo-postgres
          cache-to: type=gha,mode=max,scope=systemburo-postgres
      - name: Verify PostgreSQL startup and restart compatibility
        run: bash .github/scripts/verify_postgres_runtime.sh systemburo-postgres:ci
      - name: Build pgAdmin runtime
        uses: docker/build-push-action@v7
        with:
          context: ./pgadmin
          target: production
          no-cache-filters: production
          tags: |
            systemburo-pgadmin:ci
            ghcr.io/${{ steps.repo.outputs.lower }}-pgadmin:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=systemburo-pgadmin
          cache-to: type=gha,mode=max,scope=systemburo-pgadmin
      - name: Scan pgAdmin runtime
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.76.1'
          image-ref: systemburo-pgadmin:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
      - name: Scan PostgreSQL runtime
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.76.1'
          image-ref: systemburo-postgres:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
      - name: Scan backend runtime
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.76.1'
          image-ref: systemburo:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
      - name: Scan frontend runtime
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.76.1'
          image-ref: systemburo-frontend:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
      - name: Scan staging edge runtime
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.76.1'
          image-ref: systemburo-nginx:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
      - name: Scan production edge runtime
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.76.1'
          image-ref: systemburo-nginx-prod:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
      - name: Verify backend image runs as non-root
        run: docker run --rm systemburo:ci id
      - name: Record scanned image identities
        run: |
          for image in systemburo:ci systemburo-frontend:ci systemburo-nginx:ci systemburo-nginx-prod:ci systemburo-postgres:ci systemburo-pgadmin:ci; do
            docker image inspect --format '{{.Id}} {{json .RepoDigests}}' "$image"
          done
      - name: Push scanned images to ghcr.io
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod')
        env:
          REPO_LOWER: ${{ steps.repo.outputs.lower }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          for component in backend frontend nginx nginx-prod postgres pgadmin; do
            image="ghcr.io/${REPO_LOWER}-${component}"
            docker push "${image}:${RELEASE_SHA}"
            # Prod never changes the staging/default dev aliases.
            if [ "$RELEASE_BRANCH" = dev ]; then
              docker tag "${image}:${RELEASE_SHA}" "${image}:dev"
              docker push "${image}:dev"
            fi
          done

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    # always() нужен чтобы deploy не skipped транзитивно когда какие-то
    # upstream jobs (backend-test/frontend-test) skip из-за paths filter.
    # Docker Build сам использует always() по той же причине.
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      github.event_name == 'push' &&
      needs.docker-build.result == 'success'
    environment: staging
    permissions:
      contents: write
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require trusted host and exact-SHA security checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: python3 .github/scripts/wait_release_checks.py --branch dev --workflow security.yml
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          # Передаём GITHUB_TOKEN на VPS чтобы docker login в ghcr.io
          # (org buropropuskov не разрешает public packages, нужна auth).
          envs: GHCR_USER,GHCR_TOKEN
          command_timeout: 15m
          script: |
            set -e
            export DOCKER_BUILDKIT=1
            test -d /opt/systemburo/.git || git clone git@github.com:${{ github.repository }}.git /opt/systemburo
            cd /opt/systemburo
            git fetch origin dev
            # Конфигурации и образы должны относиться к одной ревизии деплоя.
            git reset --hard ${{ github.sha }}
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            test -f .env || bash scripts/init-env.sh staging ${{ secrets.STAGING_DOMAIN }}
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export FRONTEND_IMAGE="ghcr.io/${REPO_LOWER}-frontend:${{ github.sha }}"
            export BACKEND_IMAGE="ghcr.io/${REPO_LOWER}-backend:${{ github.sha }}"
            export NGINX_IMAGE="ghcr.io/${REPO_LOWER}-nginx:${{ github.sha }}"
            export POSTGRES_IMAGE="ghcr.io/${REPO_LOWER}-postgres:${{ github.sha }}"
            export PGADMIN_IMAGE="ghcr.io/${REPO_LOWER}-pgadmin:${{ github.sha }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "Pulling pre-built images: $FRONTEND_IMAGE, $BACKEND_IMAGE, $NGINX_IMAGE, $POSTGRES_IMAGE, $PGADMIN_IMAGE"
            docker pull "$FRONTEND_IMAGE"
            docker pull "$BACKEND_IMAGE"
            docker pull "$NGINX_IMAGE"
            docker pull "$POSTGRES_IMAGE"
            docker pull "$PGADMIN_IMAGE"
            docker logout ghcr.io
            # Compose без BACKEND_IMAGE берёт метку dev, а её здесь никто не тянул: ручной
            # docker compose up поднимал образ многонедельной давности, и его миграция
            # сузила столбцы телефонов, обрезав шифротекст (#2568). Метка dev на VPS
            # обязана указывать на выкаченный код.
            docker tag "$FRONTEND_IMAGE" "ghcr.io/${REPO_LOWER}-frontend:dev"
            docker tag "$BACKEND_IMAGE" "ghcr.io/${REPO_LOWER}-backend:dev"
            docker tag "$NGINX_IMAGE" "ghcr.io/${REPO_LOWER}-nginx:dev"
            docker tag "$POSTGRES_IMAGE" "ghcr.io/${REPO_LOWER}-postgres:dev"
            docker tag "$POSTGRES_IMAGE" systemburo-postgres:production
            docker tag "$PGADMIN_IMAGE" "ghcr.io/${REPO_LOWER}-pgadmin:dev"
            docker tag "$PGADMIN_IMAGE" systemburo-pgadmin:production
            # Сохраняем локальное имя для ручного запуска Compose без NGINX_IMAGE.
            docker tag "$NGINX_IMAGE" systemburo-nginx
              # Удаляем только служебный контейнер: без -v том с данными сохраняется.
              # Старый restart:always не должен возвращать его после перезапуска Docker.
              # Следующий ручной запуск tools применит текущие лимиты и образ.
              docker compose -f docker-compose.base.yml -f docker-compose.staging.yml --profile tools rm --stop --force pgadmin
            docker compose -f docker-compose.base.yml -f docker-compose.staging.yml up -d --force-recreate --no-build
            # Образы из реестра тегированы по SHA и копятся по одному на деплой.
            # Оставляем текущий и метку dev, остальные сносим: на диске VPS тесно.
            # Уборка best-effort - занятый образ не удалится, и это не повод падать.
            for image_repo in "${REPO_LOWER}-frontend" "${REPO_LOWER}-backend" "${REPO_LOWER}-nginx" "${REPO_LOWER}-postgres" "${REPO_LOWER}-pgadmin"; do
              docker images "ghcr.io/${image_repo}" --format '{{.Repository}}:{{.Tag}}' \
                | grep -v ':dev$' | grep -v ':${{ github.sha }}$' \
                | xargs -r docker rmi 2>/dev/null || true
            done
            docker system prune -f --filter 'until=24h' 2>/dev/null || true
            docker builder prune -f --filter 'until=168h' 2>/dev/null || true
            # Прошлые теги фронта помечены SHA коммита, то есть не dangling, и
            # docker system prune их не забирает: к августу на диске VPS осело
            # 346 образов и больше четырёх гигабайт. Фильтр по возрасту здесь не
            # годится - он считает возраст от сборки образа, и заодно снёс бы
            # базовые golang/alpine/nginx, которые нужны для сборки на месте.
            # Метка dev висит на том же образе, что и текущий: сравнение по ID не даёт
            # rmi -f снять метки с работающего образа через его второе имя.
            KEEP_FRONTEND_ID=$(docker images --format '{{.ID}}' "$FRONTEND_IMAGE")
            docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | awk -v keep="$FRONTEND_IMAGE" -v keepid="$KEEP_FRONTEND_ID" '$1 ~ /systemburo-frontend/ && $1 != keep && $2 != keepid { print $2 }' | xargs -r docker rmi -f 2>/dev/null || true
            sleep 5
            wget -qO- http://localhost/health || exit 1
            echo "Staging deploy completed at $(date)"
      - name: Sync staging branch
        run: git push origin HEAD:refs/heads/staging

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - paths
      - commit-lint
      - backend-vet
      - backend-test
      - frontend-lint
      - frontend-test
      - frontend-bundle
      - release-policy-tests
      - docker-build
      - deploy-staging
    if: always()
    steps:
      - name: Fail if any dependency failed
        run: |
          results='${{ toJson(needs) }}'
          echo "$results"
          if echo "$results" | grep -q '"result": "failure"'; then
            echo "One or more required jobs failed."
            exit 1
          fi
          if echo "$results" | grep -q '"result": "cancelled"'; then
            echo "One or more required jobs were cancelled."
            exit 1
          fi
          echo "All upstream jobs succeeded or were skipped."
