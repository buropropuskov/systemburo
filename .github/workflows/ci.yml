name: CI

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
    branches: [dev, prod]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  paths:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'cmd/**'
              - 'internal/**'
              - 'docs/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              # Перечень сторонних компонентов стерегут два замка - Go-тест и
              # спека фронта. Без этой строки правка одного лишь перечня не
              # запускала ни одного из них: убрать из него строку и слить зелёным
              # было бы можно.
              - 'THIRD-PARTY-NOTICES.md'
            frontend:
              - 'frontend/**'
              - 'THIRD-PARTY-NOTICES.md'
            infra:
              - 'docker-compose*.yml'
              - 'nginx/**'
              - 'scripts/**'
              - 'Makefile'
            workflows:
              - '.github/**'

  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate commit messages
        run: |
          PATTERN="^(fix|feat|feature|refactor|docs|test|chore|style|build|ci|perf)(\(.+\))?: .{3,}"
          git log --format="%s" --no-merges origin/${{ github.base_ref }}..HEAD | while read -r msg; do
            if ! echo "$msg" | grep -qE "$PATTERN"; then
              echo "❌ $msg"
              echo "   Формат: prefix(scope): описание"
              exit 1
            fi
            echo "✅ $msg"
          done

  backend-vet:
    name: Go Vet
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.backend == 'true' || needs.paths.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - run: go vet ./...

  backend-test:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: [paths, backend-vet]
    if: needs.paths.outputs.backend == 'true' || needs.paths.outputs.workflows == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auto_registry_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://postgres:testpass@localhost:5432/auto_registry
      DATABASE_URL_TEST: postgres://postgres:testpass@localhost:5432/auto_registry_test
      JWT_SECRET: ci-test-jwt-secret-that-is-at-least-32-chars!!
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-at-least-32-chars!
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Run tests
        # 1000s: пакет handlers под -race подходил к прежним 500s вплотную и валил
        # ветку по таймауту, не по сути теста. Запас взят с расчётом на рост числа
        # тестов; если упрётся снова, пакет пора делить, а не поднимать предел.
        run: go test -race -count=1 -timeout 1000s -p 4 ./...

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.frontend == 'true' || needs.paths.outputs.workflows == 'true'
    steps:
      # Полная история нужна проверке размеров: она сравнивает файлы с общим
      # предком ветки и dev, а не с зафиксированным снимком.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-frontend
      - working-directory: frontend
        run: npm run lint
      # Храповик на размер файлов: новый файл обязан уложиться в порог, а файл,
      # который уже сверх порога, не может вырасти дальше. Порог опускается по
      # мере распила мега-компонентов.
      - working-directory: frontend
        run: npm run lint:size

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [paths, frontend-lint]
    if: needs.paths.outputs.frontend == 'true' || needs.paths.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - working-directory: frontend
        run: npm run test:run

  frontend-bundle:
    name: Frontend Bundle Budget
    runs-on: ubuntu-latest
    needs: [paths, frontend-lint]
    if: needs.paths.outputs.frontend == 'true' || needs.paths.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      # Считаем цену открытия страницы логина: точка входа, modulepreload и
      # стили из dist/index.html. Ленивые чанки роутов в бюджет не входят.
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm run lint:bundle

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [paths, backend-test, frontend-test]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Логинимся в ghcr.io только когда пушим (push в dev/main).
      # Для PR/manual builds логин пропускаем - в этих случаях push: false.
      - name: Log in to ghcr.io
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase repo for ghcr.io
        id: repo
        run: echo "lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      # Backend, как и frontend ниже, уезжает в ghcr.io и деплоится через pull.
      # Раньше готовый образ здесь выбрасывался, а VPS собирал его заново пять
      # минут: go install swag, go mod download и компиляция двух бинарей на
      # слабом CPU. Публикуем после проверки на non-root, а не одним шагом с
      # ней - в реестр не должен попасть образ, который её не прошёл.
      - name: Build backend image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          tags: |
            systemburo:ci
            ghcr.io/${{ steps.repo.outputs.lower }}-backend:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.lower }}-backend:dev
          load: true
          cache-from: type=gha,scope=systemburo-backend
          cache-to: type=gha,mode=max,scope=systemburo-backend
      # Frontend image пушим в ghcr.io для деплоя - на слабом VPS Jino
      # npm ci + vite build занимали 30+ минут (I/O bottleneck linking
      # node_modules). На GA runner это <2 минут, и deploy на VPS
      # сводится к docker pull (~30s) + up. Тэгируем SHA для воспроизводимости
      # + dev для последнего.
      - name: Build frontend image (cached + push на dev)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: production
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/dev' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.lower }}-frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.lower }}-frontend:dev
          cache-from: type=gha,scope=systemburo-frontend
          cache-to: type=gha,mode=max,scope=systemburo-frontend
      - name: Verify backend image runs as non-root
        run: docker run --rm systemburo:ci id

      - name: Push backend image to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          docker push ghcr.io/${{ steps.repo.outputs.lower }}-backend:${{ github.sha }}
          docker push ghcr.io/${{ steps.repo.outputs.lower }}-backend:dev

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    # always() нужен чтобы deploy не skipped транзитивно когда какие-то
    # upstream jobs (backend-test/frontend-test) skip из-за paths filter.
    # Docker Build сам использует always() по той же причине.
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      github.event_name == 'push' &&
      needs.docker-build.result == 'success'
    environment: staging
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Передаём GITHUB_TOKEN на VPS чтобы docker login в ghcr.io
          # (org buropropuskov не разрешает public packages, нужна auth).
          envs: GHCR_USER,GHCR_TOKEN
          command_timeout: 15m
          script: |
            set -e
            export DOCKER_BUILDKIT=1
            test -d /opt/systemburo/.git || git clone git@github.com:${{ github.repository }}.git /opt/systemburo
            cd /opt/systemburo
            git fetch origin dev
            git reset --hard origin/dev
            test -f .env || bash scripts/init-env.sh staging ${{ secrets.STAGING_DOMAIN }}
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export FRONTEND_IMAGE="ghcr.io/${REPO_LOWER}-frontend:${{ github.sha }}"
            export BACKEND_IMAGE="ghcr.io/${REPO_LOWER}-backend:${{ github.sha }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            echo "Pulling pre-built images: $FRONTEND_IMAGE, $BACKEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"
            docker pull "$BACKEND_IMAGE"
            docker logout ghcr.io
            # На VPS собирается только nginx: alpine плюс apk add openssl, секунды.
            docker compose -f docker-compose.base.yml -f docker-compose.staging.yml build --pull nginx
            docker compose -f docker-compose.base.yml -f docker-compose.staging.yml up -d --force-recreate
            # Образы из реестра тегированы по SHA и копятся по одному на деплой.
            # Оставляем текущий и метку dev, остальные сносим: на диске VPS тесно.
            # Уборка best-effort - занятый образ не удалится, и это не повод падать.
            for image_repo in "${REPO_LOWER}-frontend" "${REPO_LOWER}-backend"; do
              docker images "ghcr.io/${image_repo}" --format '{{.Repository}}:{{.Tag}}' \
                | grep -v ':dev$' | grep -v ':${{ github.sha }}$' \
                | xargs -r docker rmi 2>/dev/null || true
            done
            docker system prune -f --filter 'until=24h' 2>/dev/null || true
            docker builder prune -f --filter 'until=168h' 2>/dev/null || true
            # Прошлые теги фронта помечены SHA коммита, то есть не dangling, и
            # docker system prune их не забирает: к августу на диске VPS осело
            # 346 образов и больше четырёх гигабайт. Фильтр по возрасту здесь не
            # годится - он считает возраст от сборки образа, и заодно снёс бы
            # базовые golang/alpine/nginx, которые нужны для сборки на месте.
            docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | awk -v keep="$FRONTEND_IMAGE" '$1 ~ /systemburo-frontend/ && $1 != keep { print $2 }' | xargs -r docker rmi -f 2>/dev/null || true
            sleep 5
            wget -qO- http://localhost/health || exit 1
            echo "Staging deploy completed at $(date)"
      - name: Sync staging branch
        run: git push origin dev:staging

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - paths
      - commit-lint
      - backend-vet
      - backend-test
      - frontend-lint
      - frontend-test
      - frontend-bundle
      - docker-build
      - deploy-staging
    if: always()
    steps:
      - name: Fail if any dependency failed
        run: |
          results='${{ toJson(needs) }}'
          echo "$results"
          if echo "$results" | grep -q '"result": "failure"'; then
            echo "One or more required jobs failed."
            exit 1
          fi
          if echo "$results" | grep -q '"result": "cancelled"'; then
            echo "One or more required jobs were cancelled."
            exit 1
          fi
          echo "All upstream jobs succeeded or were skipped."
