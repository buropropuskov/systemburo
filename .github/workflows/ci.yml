name: CI

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
    branches: [dev, prod]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  paths:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'cmd/**'
              - 'internal/**'
              - 'docs/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
            frontend:
              - 'frontend/**'
            infra:
              - 'docker-compose*.yml'
              - 'nginx/**'
              - 'scripts/**'
              - 'Makefile'
            workflows:
              - '.github/**'

  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate commit messages
        run: |
          PATTERN="^(fix|feat|feature|refactor|docs|test|chore|style|build|ci|perf)(\(.+\))?: .{3,}"
          git log --format="%s" --no-merges origin/${{ github.base_ref }}..HEAD | while read -r msg; do
            if ! echo "$msg" | grep -qE "$PATTERN"; then
              echo "❌ $msg"
              echo "   Формат: prefix(scope): описание"
              exit 1
            fi
            echo "✅ $msg"
          done

  backend-vet:
    name: Go Vet
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.backend == 'true' || needs.paths.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
      - run: go vet ./...

  backend-test:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: [paths, backend-vet]
    if: needs.paths.outputs.backend == 'true' || needs.paths.outputs.workflows == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auto_registry_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://postgres:testpass@localhost:5432/auto_registry
      DATABASE_URL_TEST: postgres://postgres:testpass@localhost:5432/auto_registry_test
      JWT_SECRET: ci-test-jwt-secret-that-is-at-least-32-chars!!
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-at-least-32-chars!
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-go
      - name: Run tests
        run: go test -race -count=1 -timeout 120s -p 4 ./...

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    needs: paths
    if: needs.paths.outputs.frontend == 'true' || needs.paths.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-frontend
      - working-directory: frontend
        run: npm run lint

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [paths, frontend-lint]
    if: needs.paths.outputs.frontend == 'true' || needs.paths.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-frontend
      - working-directory: frontend
        run: npm run test:run

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [paths, backend-test, frontend-test]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          tags: systemburo:ci
          load: true
          cache-from: type=gha,scope=systemburo-backend
          cache-to: type=gha,mode=max,scope=systemburo-backend
      - name: Build frontend image (cached)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: production
          tags: systemburo-frontend:ci
          load: true
          cache-from: type=gha,scope=systemburo-frontend
          cache-to: type=gha,mode=max,scope=systemburo-frontend
      - name: Verify backend image runs as non-root
        run: docker run --rm systemburo:ci id

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    # always() нужен чтобы deploy не skipped транзитивно когда какие-то
    # upstream jobs (backend-test/frontend-test) skip из-за paths filter.
    # Docker Build сам использует always() по той же причине.
    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      github.event_name == 'push' &&
      needs.docker-build.result == 'success'
    environment: staging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Default command_timeout=10m - не хватает на полный npm ci + Docker rebuild
          # с npmmirror (медленнее чем прежний Cloudflare-кеш). Ставим 30m.
          command_timeout: 30m
          script: |
            set -e
            export DOCKER_BUILDKIT=1
            test -d /opt/systemburo/.git || git clone git@github.com:${{ github.repository }}.git /opt/systemburo
            cd /opt/systemburo
            git fetch origin dev
            git reset --hard origin/dev
            test -f .env || bash scripts/init-env.sh staging ${{ secrets.STAGING_DOMAIN }}
            # Forced rebuild для frontend — docker buildkit агрессивно кеширует
            # слои через COPY . .; при git reset даже при изменении .vue файлов
            # слой может остаться CACHED и старый бандл окажется в проде.
            # --no-cache инвалидирует только image-layer cache, BuildKit
            # cache mounts (--mount=type=cache в Dockerfile) переживают
            # пересборку и сохраняют npm+vite tarballs/transforms между
            # деплоями. Деплой 1-2 мин вместо 15-30 после прогрева кэша.
            docker compose -f docker-compose.base.yml -f docker-compose.staging.yml build --pull --no-cache frontend
            docker compose -f docker-compose.base.yml -f docker-compose.staging.yml build --pull backend nginx
            docker compose -f docker-compose.base.yml -f docker-compose.staging.yml up -d --force-recreate
            docker system prune -f --filter 'until=24h' 2>/dev/null || true
            # builder prune раньше сносил BuildKit cache mounts каждые 24h,
            # из-за чего каждый деплой был холодным. Удлиняем до 7 дней:
            # при стабильных package-lock.json кэш живёт между фичами.
            docker builder prune -f --filter 'until=168h' 2>/dev/null || true
            sleep 5
            wget -qO- http://localhost/health || exit 1
            echo "Staging deploy completed at $(date)"
      - name: Sync staging branch
        run: git push origin dev:staging

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - paths
      - commit-lint
      - backend-vet
      - backend-test
      - frontend-lint
      - frontend-test
      - docker-build
      - deploy-staging
    if: always()
    steps:
      - name: Fail if any dependency failed
        run: |
          results='${{ toJson(needs) }}'
          echo "$results"
          if echo "$results" | grep -q '"result": "failure"'; then
            echo "One or more required jobs failed."
            exit 1
          fi
          if echo "$results" | grep -q '"result": "cancelled"'; then
            echo "One or more required jobs were cancelled."
            exit 1
          fi
          echo "All upstream jobs succeeded or were skipped."
