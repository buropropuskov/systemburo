name: Deploy Production

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      confirm:
        description: Введите "deploy" для подтверждения
        required: true
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  gate:
    name: Confirm manual dispatch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check confirm input
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$CONFIRM" != "deploy" ] || [ "$RELEASE_REF" != refs/heads/prod ]; then
            echo "Подтверждение не получено (введите \"deploy\")."
            exit 1
          fi

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [gate]
    if: |
      always() &&
      github.ref == 'refs/heads/prod' &&
      (github.event_name == 'push' || needs.gate.result == 'success')
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require trusted host and exact-SHA release checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: python3 .github/scripts/wait_release_checks.py --branch prod --workflow ci.yml --workflow security.yml
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: GHCR_USER,GHCR_TOKEN
          command_timeout: 15m
          script: |
            set -e
            export DOCKER_BUILDKIT=1
            test -d /opt/systemburo/.git || git clone git@github.com:${{ github.repository }}.git /opt/systemburo
            cd /opt/systemburo
            git fetch origin prod
            git reset --hard ${{ github.sha }}
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            test "$(git rev-parse origin/prod)" = "${{ github.sha }}"
            test -f .env || bash scripts/init-env.sh production ${{ secrets.PROD_DOMAIN }}
            # Поставляем именно просканированные в CI образы данной ревизии.
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export FRONTEND_IMAGE="ghcr.io/${REPO_LOWER}-frontend:${{ github.sha }}"
            export BACKEND_IMAGE="ghcr.io/${REPO_LOWER}-backend:${{ github.sha }}"
            export NGINX_IMAGE="ghcr.io/${REPO_LOWER}-nginx-prod:${{ github.sha }}"
            export POSTGRES_IMAGE="ghcr.io/${REPO_LOWER}-postgres:${{ github.sha }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            docker pull "$FRONTEND_IMAGE"
            docker pull "$BACKEND_IMAGE"
            docker pull "$NGINX_IMAGE"
            docker pull "$POSTGRES_IMAGE"
            # The local Compose fallback must refer to the delivered DB runtime.
            docker tag "$POSTGRES_IMAGE" systemburo-postgres:production
            docker logout ghcr.io
            docker compose -f docker-compose.base.yml -f docker-compose.prod.yml up -d --force-recreate --no-build
            # Прежняя сборка фронта на сервере без кеша оставляла слои каждого
            # выпуска. С готовыми образами сохраняем ограниченную уборку. На стенде
            # такое накопление за четыре месяца заняло больше четырёх гигабайт и
            # довело диск до 83 процентов; на рабочем сервере цена выше.
            #
            # Порядок команд от безопасного к жадному: висячие слои, затем кеш
            # сборки старше недели (недельный запас держит быстрые пересборки),
            # затем образы без единого контейнера, старше суток. Тома не трогаем
            # ни одной из команд - в них база и загруженные файлы.
            docker image prune -f 2>/dev/null || true
            docker builder prune -f --filter 'until=168h' 2>/dev/null || true
            docker image prune -af --filter 'until=24h' 2>/dev/null || true
            sleep 5
            docker compose -f docker-compose.base.yml -f docker-compose.prod.yml exec -T backend wget -qO- http://localhost:8080/health || exit 1
            echo "Production deploy completed at $(date)"
