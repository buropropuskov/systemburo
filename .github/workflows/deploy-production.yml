name: Deploy Production

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      confirm:
        description: Введите "deploy" для подтверждения
        required: true
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Confirm manual dispatch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check confirm input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Подтверждение не получено (введите \"deploy\")."
            exit 1
          fi

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [gate]
    if: |
      always() &&
      (github.event_name == 'push' || needs.gate.result == 'success')
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: prod
          fetch-depth: 0
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            export DOCKER_BUILDKIT=1
            test -d /opt/systemburo/.git || git clone git@github.com:${{ github.repository }}.git /opt/systemburo
            cd /opt/systemburo
            git fetch origin prod
            git reset --hard origin/prod
            test -f .env || bash scripts/init-env.sh production ${{ secrets.PROD_DOMAIN }}
            # Frontend пересобираем без кеша — buildkit удерживает старые
            # слои COPY . . даже при изменении исходников. BuildKit cache
            # mounts из Dockerfile переживают --no-cache и сохраняют npm
            # tarballs + vite cache (~10x ускорение после первого прогрева).
            docker compose -f docker-compose.base.yml -f docker-compose.prod.yml build --pull --no-cache frontend
            docker compose -f docker-compose.base.yml -f docker-compose.prod.yml build --pull backend nginx
            docker compose -f docker-compose.base.yml -f docker-compose.prod.yml up -d --force-recreate
            # Уборки здесь не было вовсе, а фронт собирается на месте без кеша:
            # каждый выпуск оставляет полный набор слоёв прошлой сборки. На стенде
            # такое накопление за четыре месяца заняло больше четырёх гигабайт и
            # довело диск до 83 процентов; на рабочем сервере цена выше.
            #
            # Порядок команд от безопасного к жадному: висячие слои, затем кеш
            # сборки старше недели (недельный запас держит быстрые пересборки),
            # затем образы без единого контейнера, старше суток. Тома не трогаем
            # ни одной из команд - в них база и загруженные файлы.
            docker image prune -f 2>/dev/null || true
            docker builder prune -f --filter 'until=168h' 2>/dev/null || true
            docker image prune -af --filter 'until=24h' 2>/dev/null || true
            sleep 5
            docker compose -f docker-compose.base.yml -f docker-compose.prod.yml exec -T backend wget -qO- http://localhost:8080/health || exit 1
            echo "Production deploy completed at $(date)"
