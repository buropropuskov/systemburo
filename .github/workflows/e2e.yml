name: E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - 'frontend/**'
      - 'internal/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/e2e.yml'
      - '.github/actions/**'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright E2E (shard ${{ matrix.shard }}/${{ matrix.totalShards }})
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        totalShards: [4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auto_registry
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://postgres:testpass@localhost:5432/auto_registry
      JWT_SECRET: ci-test-jwt-secret-that-is-at-least-32-chars!!
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-at-least-32-chars!
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:8081"
      E2E_SUPERADMIN_USER: buropropuskov
      E2E_SUPERADMIN_PASSWORD: 'BuroAdmin2026!'
      E2E_API_BASE_URL: 'http://localhost:8080/api'
      LOGIN_RATE_LIMIT_MAX: '1000'
      LOGIN_RATE_LIMIT_WINDOW_SEC: '60'
      # API rate-limit повышаем для параллельных e2e shards - 4 worker'а
      # перегружали дефолтный 200/мин при создании unique-employees/cars.
      RATE_LIMIT_PER_MINUTE: '5000'
      RATE_LIMIT_WINDOW_SEC: '60'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-frontend
      - uses: ./.github/actions/playwright-cache
        with:
          browser: chromium

      - name: Build backend
        run: go build -o ./bin/server ./cmd/server

      - name: Build seed binary
        run: go build -o ./bin/seed ./cmd/seed

      - name: Start backend
        run: |
          nohup ./bin/server > backend.log 2>&1 &
          echo $! > backend.pid
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "backend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not become healthy in 120s"
          echo "--- backend.log ---"
          cat backend.log || true
          exit 1

      - name: Start frontend
        run: |
          cd frontend
          nohup env VITE_API_BASE_URL=http://localhost:8080 npx vite --port 8081 --host 0.0.0.0 > ../frontend.log 2>&1 &
          echo $! > ../frontend.pid
          cd ..
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8081 > /dev/null; then
              echo "frontend ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::frontend did not become available in 60s"
          echo "--- frontend.log ---"
          cat frontend.log || true
          exit 1

      - name: Seed admin + E2E users (buropropuskov, e2e_admin, e2e_user)
        env:
          SEED_E2E_USERS: "true"
        run: ./bin/seed 'BuroAdmin2026!'

      - name: Run Playwright tests (shard ${{ matrix.shard }}/${{ matrix.totalShards }})
        working-directory: frontend
        # --grep-invert site-smoke - тяжёлый crawler (5+ мин против staging)
        # запускается отдельно через site-smoke.yml workflow_dispatch.
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/${{ matrix.totalShards }} --grep-invert "Site smoke"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 14

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "--- backend.log ---"
          cat backend.log 2>/dev/null || echo "no backend.log"
          echo ""
          echo "--- frontend.log ---"
          cat frontend.log 2>/dev/null || echo "no frontend.log"
