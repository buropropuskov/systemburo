name: Security

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      # Полная история: сканируем не только текущее состояние, но и коммиты -
      # удалённый из дерева ключ остаётся в открытом репозитории навсегда.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Официальный action берёт лицензию с организаций, поэтому контейнер.
      # Версия прибита: с плавающей меткой набор правил меняется на стороне
      # разработчика, и сборка краснеет или зеленеет без наших правок.
      # Разобранные срабатывания перечислены отпечатками в .gitleaksignore,
      # новое срабатывание роняет сборку намеренно.
      - name: Run gitleaks
        run: |
          set -o pipefail
          docker run --rm -v "$PWD":/repo -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --no-banner --redact --exit-code 1 2>&1 | tee gitleaks.log
          # Прогон, не увидевший ни одного коммита, заканчивается словами
          # "no leaks found" и нулевым кодом - то есть этап зеленеет, ничего не
          # проверив. Так было при запуске в git-worktree, где .git это файл-ссылка;
          # то же даст checkout мелкой глубины. Требуем непустого счётчика.
          grep -qE "[1-9][0-9]* commits scanned" gitleaks.log || {
            echo "gitleaks не просканировал ни одного коммита - проверка недействительна"
            exit 1
          }

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: npm audit (production deps, high+)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (dev deps, informational)
        working-directory: frontend
        run: npm audit --audit-level=high || true

  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          tags: systemburo:scan
          load: true
          cache-from: type=gha,scope=systemburo-backend
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'systemburo:scan'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          vuln-type: 'os,library'

# dependency-review требует GitHub Advanced Security (платная фича).
# На текущем плане не работает — вернём когда будет GHAS.
# Закрывается бесплатным dependabot + govulncheck + npm audit.
