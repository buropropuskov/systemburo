name: Security

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend
      - working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          tags: systemburo:scan
          load: true
          cache-from: type=gha,scope=systemburo-backend
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'systemburo:scan'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          vuln-type: 'os,library'

# dependency-review требует GitHub Advanced Security (платная фича).
# На текущем плане не работает — вернём когда будет GHAS.
# Закрывается бесплатным dependabot + govulncheck + npm audit.
