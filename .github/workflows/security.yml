name: Security

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      # Полная история: сканируем не только текущее состояние, но и коммиты -
      # удалённый из дерева ключ остаётся в открытом репозитории навсегда.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Официальный action берёт лицензию с организаций, поэтому контейнер.
      # Версия прибита: с плавающей меткой набор правил меняется на стороне
      # разработчика, и сборка краснеет или зеленеет без наших правок.
      # Разобранные срабатывания перечислены отпечатками в .gitleaksignore,
      # новое срабатывание роняет сборку намеренно.
      - name: Run gitleaks
        run: |
          set -o pipefail
          docker run --rm -v "$PWD":/repo -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --no-banner --redact --exit-code 1 2>&1 | tee gitleaks.log
          # Прогон, не увидевший ни одного коммита, заканчивается словами
          # "no leaks found" и нулевым кодом - то есть этап зеленеет, ничего не
          # проверив. Так было при запуске в git-worktree, где .git это файл-ссылка;
          # то же даст checkout мелкой глубины. Требуем непустого счётчика.
          grep -qE "[1-9][0-9]* commits scanned" gitleaks.log || {
            echo "gitleaks не просканировал ни одного коммита - проверка недействительна"
            exit 1
          }

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        # Не сам govulncheck, а обёртка над ним: уязвимость без выпущенного
        # исправления иначе держала бы проверку красной неделями, и красный чек
        # переставали бы читать. Отсрочки перечислены в
        # scripts/govulncheck-exceptions.json, каждая живёт до своей даты и
        # снимается сама, как только выходит исправление.
        run: python3 scripts/govulncheck_gate.py

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: npm audit (production deps, high+)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (dev deps, informational)
        working-directory: frontend
        run: npm audit --audit-level=high || true

  runtime-image-scan:
    name: Trivy Runtime Scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: ./Dockerfile
            target: production
            runtime: production
            image: systemburo:scan
            cache: systemburo-backend
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            target: production
            runtime: production
            image: systemburo-frontend:scan
            cache: systemburo-frontend
          - name: staging-edge
            context: ./nginx
            file: ./nginx/Dockerfile.staging
            target: staging
            runtime: production,staging
            image: systemburo-nginx:scan
            cache: systemburo-staging-nginx
          - name: production-edge
            context: ./nginx
            file: ./nginx/Dockerfile.staging
            target: production
            runtime: production
            image: systemburo-nginx-prod:scan
            cache: systemburo-production-nginx
          - name: postgres
            context: ./postgres
            file: ./postgres/Dockerfile
            target: production
            runtime: production
            image: systemburo-postgres:scan
            cache: systemburo-postgres
          - name: pgadmin
            context: ./pgadmin
            file: ./pgadmin/Dockerfile
            target: production
            runtime: production
            image: systemburo-pgadmin:scan
            cache: systemburo-pgadmin
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        if: matrix.context != ''
      - name: Build final runtime image
        if: matrix.context != ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          no-cache-filters: ${{ matrix.runtime }}
          tags: ${{ matrix.image }}
          load: true
          cache-from: type=gha,scope=${{ matrix.cache }}
      - name: Pull external runtime image
        if: matrix.context == ''
        env:
          IMAGE: ${{ matrix.image }}
        run: docker pull "$IMAGE"
      - name: Record scanned image identity
        env:
          IMAGE: ${{ matrix.image }}
        run: docker image inspect --format '{{.Id}} {{json .RepoDigests}}' "$IMAGE"
      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.76.1'
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

  trivy-scan:
    # Preserve the existing required-check name while requiring every image.
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: runtime-image-scan
    if: always()
    steps:
      - name: Require all runtime image scans
        env:
          SCAN_RESULT: ${{ needs.runtime-image-scan.result }}
        run: test "$SCAN_RESULT" = success

# dependency-review требует GitHub Advanced Security (платная фича).
# На текущем плане не работает — вернём когда будет GHAS.
# Закрывается бесплатным dependabot + govulncheck + npm audit.
