# .github/workflows/ci.yml
# CI/CD-пайплайн для проекта Dockee. Запускается при каждом push в main/develop
# и при открытии pull request. Состоит из четырёх параллельных стадий и одной
# последовательной — сквозных тестов, которые зависят от успеха остальных.
#
# Стек: GitHub Actions. Логика: фронтенд и бэкенд проверяются параллельно,
# API-тесты требуют поднятого бэкенда, E2E — поднятой и фронтенда, и бэкенда.

name: Dockee CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  backend-unit:
    name: Backend unit-тесты (Go + testify)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { repository: airvt1x/dokkee-backend, path: backend }

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}

      - name: Run tests with race detector
        working-directory: backend
        env:
          salt: ci-salt-stub
          sign_key: ci-sign-key-stub
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  # --------------------------------------------------------------------------
  backend-integration:
    name: Backend integration (PostgreSQL)
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     dokkee_test
          POSTGRES_PASSWORD: dokkee_test
          POSTGRES_DB:       dokkee_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with: { repository: airvt1x/dokkee-backend, path: backend }

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Apply migrations
        working-directory: backend
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: dokkee_test
          PGPASSWORD: dokkee_test
          PGDATABASE: dokkee_test
        run: |
          for f in migrations/*.up.sql; do
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run integration tests
        working-directory: backend
        env:
          salt: ci-salt
          sign_key: ci-sign-key
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: dokkee_test
          DB_PASSWORD: dokkee_test
          DB_NAME: dokkee_test
        run: go test -tags=integration ./internal/repository/...

  # --------------------------------------------------------------------------
  frontend-unit:
    name: Frontend unit-тесты (Vitest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { repository: keeq0/dokkee-frontend, path: frontend }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: npm run test:unit -- --reporter=verbose --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # --------------------------------------------------------------------------
  api-tests:
    name: API-тесты (Postman + Newman)
    runs-on: ubuntu-22.04
    needs: [backend-unit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     dokkee
          POSTGRES_PASSWORD: dokkee
          POSTGRES_DB:       dokkee
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with: { repository: airvt1x/dokkee-backend, path: backend }

      - uses: actions/checkout@v4
        with: { path: tests, sparse-checkout: tests/api }

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Start backend
        working-directory: backend
        env:
          salt: ci-salt
          sign_key: ci-sign-key
        run: |
          go build -o dokkee-server ./cmd/main.go
          ./dokkee-server &
          sleep 5

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection
        run: |
          newman run tests/tests/api/dokkee.postman_collection.json \
            --env-var "baseUrl=http://localhost:8000" \
            --env-var "testEmail=ci@example.com" \
            --env-var "testPassword=CiTestPass1!" \
            --reporters cli,junit \
            --reporter-junit-export newman-report.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: newman-report, path: newman-report.xml }

  # --------------------------------------------------------------------------
  e2e:
    name: E2E-тесты (Playwright)
    runs-on: ubuntu-22.04
    needs: [backend-unit, frontend-unit]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     dokkee
          POSTGRES_PASSWORD: dokkee
          POSTGRES_DB:       dokkee
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4
        with: { repository: airvt1x/dokkee-backend, path: backend }
      - uses: actions/checkout@v4
        with: { repository: keeq0/dokkee-frontend, path: frontend }
      - uses: actions/checkout@v4
        with: { path: tests, sparse-checkout: tests/e2e }

      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Build and run backend
        working-directory: backend
        env:
          salt: ci-salt
          sign_key: ci-sign-key
        run: |
          go build -o dokkee-server ./cmd/main.go
          ./dokkee-server &
          sleep 5

      - name: Build and serve frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx serve dist -l 8080 &
          sleep 5

      - name: Install Playwright
        working-directory: tests/tests/e2e
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium firefox

      - name: Run Playwright tests
        working-directory: tests/tests/e2e
        env:
          DOKKEE_URL: http://localhost:8080
          API_URL:    http://localhost:8000
          TEST_USER_EMAIL: ci@example.com
          TEST_USER_PASSWORD: CiTestPass1!
        run: npx playwright test --config playwright.config.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/tests/e2e/playwright-report/

  # --------------------------------------------------------------------------
  security:
    name: Безопасность (OWASP ZAP baseline)
    runs-on: ubuntu-22.04
    needs: [api-tests]
    steps:
      - uses: actions/checkout@v4
        with: { repository: airvt1x/dokkee-backend, path: backend }

      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Start backend
        working-directory: backend
        env:
          salt: ci-salt
          sign_key: ci-sign-key
        run: |
          go build -o dokkee-server ./cmd/main.go
          ./dokkee-server &
          sleep 5

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          fail_action: true
          cmd_options: '-a'

  # --------------------------------------------------------------------------
  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-22.04
    needs: [backend-integration, frontend-unit, api-tests, e2e]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/dokkee
            git pull origin develop
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
