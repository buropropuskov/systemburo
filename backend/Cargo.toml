[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4"
actix-cors = "0.7.0"
actix = "0.13"
actix-web-actors = "4.3"
actix-rt = "2.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8.2", features = ["postgres", "runtime-tokio-native-tls", "macros", "chrono", "uuid"] }

# Auth & Crypto (твои)
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.3.0"
argon2 = "0.5.3"
rand = "0.8"
log = "0.4"
sha2 = "0.10"
hex = "0.4.3"
secrecy = "0.10.3"
once_cell = "1.21.3"
uuid = { version = "1.20", features = ["v4", "serde"] }

# Rate limiting (новое!)
dashmap = "6.0"  # Thread-safe HashMap для rate limiter
futures-util = "0.3"
futures = "0.3"

actix-multipart = "0.6"
mime_guess = "2.0"

actix-files = "0.6"

env_logger = "0.11"
