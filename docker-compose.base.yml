services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    mem_limit: 1g
    memswap_limit: 1g

  backend:
    build:
      context: .
      target: production
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db/${DB_NAME}
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      UPLOAD_PATH: /app/uploads
      ARCHIVE_PATH: /app/archive
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    volumes:
      - uploads:/app/uploads
      # Файловый архив бланков (#1615) - каталог хоста, а не именованный том.
      # Смысл функции в том, что до файлов дотягивается человек снаружи приложения:
      # предсказуемый путь можно вынести на отдельный раздел, зашифровать, отдать в
      # сетевую папку только на чтение и включить в резервное копирование. Каталог
      # создаётся заранее с владельцем uid/gid 1001 - см. docs/DEPLOYMENT.md.
      - ${ARCHIVE_HOST_PATH:-./archive}:/app/archive
    depends_on:
      db:
        condition: service_healthy
    restart: always
    mem_limit: 512m
    memswap_limit: 512m

  frontend:
    build:
      context: ./frontend
      target: production
    depends_on:
      - backend
    restart: always
    mem_limit: 256m
    memswap_limit: 256m

volumes:
  pgdata:
  uploads:
