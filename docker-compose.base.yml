services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    mem_limit: 1g
    memswap_limit: 1g

  backend:
    build:
      context: .
      target: production
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db/${DB_NAME}
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      UPLOAD_PATH: /app/uploads
      ARCHIVE_PATH: /app/archive
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # Ниже - параметры, которые описаны в приложении Б и в шаблоне файла
      # параметров, но до этой правки внутрь контейнера не попадали: compose
      # передаёт бэкенду ЯВНЫЙ список, и всё, чего в нём нет, молча работало на
      # значениях по умолчанию. Обнаружено при включении доставки уведомлений
      # вне системы (#974): ключи лежали в файле параметров, а сервер их не видел.
      REQUIRE_ENCRYPTION: ${REQUIRE_ENCRYPTION:-false}
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE:-10485760}
      UPLOAD_ALLOWED_IMAGE_TYPES: ${UPLOAD_ALLOWED_IMAGE_TYPES:-image/jpeg,image/png,image/webp}
      UPLOAD_ALLOWED_DOC_TYPES: ${UPLOAD_ALLOWED_DOC_TYPES:-application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-200}
      RATE_LIMIT_WINDOW_SEC: ${RATE_LIMIT_WINDOW_SEC:-60}
      PAGINATION_MAX_LIMIT: ${PAGINATION_MAX_LIMIT:-100}
      # Доставка уведомлений вне системы (#974). Пустые ключи выключают её целиком.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PUSH_SUBSCRIPTION_RETENTION_DAYS: ${PUSH_SUBSCRIPTION_RETENTION_DAYS:-180}
    volumes:
      - uploads:/app/uploads
      # Файловый архив бланков (#1615) - каталог хоста, а не именованный том.
      # Смысл функции в том, что до файлов дотягивается человек снаружи приложения:
      # предсказуемый путь можно вынести на отдельный раздел, зашифровать, отдать в
      # сетевую папку только на чтение и включить в резервное копирование. Каталог
      # создаётся заранее с владельцем uid/gid 1001 - см. docs/DEPLOYMENT.md.
      - ${ARCHIVE_HOST_PATH:-./archive}:/app/archive
    depends_on:
      db:
        condition: service_healthy
    restart: always
    mem_limit: 512m
    memswap_limit: 512m

  frontend:
    build:
      context: ./frontend
      target: production
    depends_on:
      - backend
    restart: always
    mem_limit: 256m
    memswap_limit: 256m

volumes:
  pgdata:
  uploads:
