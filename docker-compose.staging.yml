services:
  # Backend, как и frontend, приезжает на стенд собранным в GitHub Actions.
  # Сборка на VPS занимала около пяти минут (go install swag, go mod download,
  # компиляция двух бинарей) и держала на диске базовый golang-образ со всеми
  # промежуточными слоями. На runner'е тот же образ собирается за полторы минуты
  # с общим кэшем, а серверу остаётся docker pull готового alpine.
  # BACKEND_IMAGE подставляет deploy script с SHA коммита.
  #
  # build из базового файла намеренно НЕ сбрасывается, в отличие от frontend:
  # руководство по развёртыванию поднимает стенд командой make staging-build, и
  # она должна собирать серверную часть из исходников без доступа к реестру.
  # Деплой из CI сборку не запускает - он pull'ит образ по тегу и поднимает.
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/buropropuskov/systemburo-backend:dev}
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-debug}

  # Frontend pre-built в GitHub Actions, pull из ghcr.io.
  # Override от docker-compose.base.yml (build: → image:).
  # FRONTEND_IMAGE подставляет deploy script с SHA коммита.
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/buropropuskov/systemburo-frontend:dev}
    build: !reset null

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.staging
    ports:
      - "80:80"
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
      BASIC_AUTH_PASS: ${BASIC_AUTH_PASS:-changeme}
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/staging-entrypoint.sh:/docker-entrypoint.d/40-htpasswd.sh:ro
    depends_on:
      - backend
      - frontend
      - pgadmin
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
      SCRIPT_NAME: /pgadmin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgadmin_data:
