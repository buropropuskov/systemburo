services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-auto_registry}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  go-backend:
    build:
      context: ./go-backend
      target: dev
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-123}@db/${DB_NAME:-auto_registry}
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "8090"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8090:8090"
    volumes:
      - ./go-backend:/app
      - go_mod_cache:/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "go mod tidy && swag init -g cmd/server/main.go -o docs 2>/dev/null; go run ./cmd/server"]

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "8081:8081"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - go-backend

volumes:
  pgdata:
  go_mod_cache:
