services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-auto_registry}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-123}@db/${DB_NAME:-auto_registry}
      BIND_HOST: "0.0.0.0"
      BIND_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "8081:8081"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

  test:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-123}@db/${DB_NAME:-auto_registry}
      DB_TEST_HOST: db
      DB_TEST_USER: postgres
      DB_TEST_PASS: ${DB_PASSWORD:-123}
      SQLX_OFFLINE: "false"
      RUST_LOG: info
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./backend/migrations:/app/migrations
      - ./backend/Cargo.toml:/app/Cargo.toml
      - ./backend/Cargo.lock:/app/Cargo.lock
    depends_on:
      db:
        condition: service_healthy
    command: ["cargo", "test", "--test", "auth_test", "--", "--test-threads=1"]
    profiles:
      - test

volumes:
  pgdata:
