services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-auto_registry}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  go-backend:
    build:
      context: .
      target: dev
    env_file: .env
    ports:
      - "${BIND_PORT:-8080}:${BIND_PORT:-8080}"
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "go mod tidy && swag init -g cmd/server/main.go -o docs 2>/dev/null; go run ./cmd/server"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    env_file: .env
    environment:
      # Vite dev-proxy цель: в docker backend доступен по имени сервиса.
      # При локальном npm run dev без docker сработает фолбэк http://localhost:8090.
      VITE_API_TARGET: http://go-backend:${BIND_PORT:-8090}
    ports:
      - "8081:8081"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - go-backend
    restart: unless-stopped

  pgadmin:
    # Та же версия, что на стенде: расхождение между машиной разработчика и
    # стендом само по себе становится источником «у меня работает».
    image: dpage/pgadmin4:9.14
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8082:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  go_mod_cache:
  pgadmin_data:
