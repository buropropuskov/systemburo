<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>systemburo — адаптивный интерфейс (мокап)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* =================================================================
   STUDIO CHROME  (devtools-оболочка мокапа — нейтральная, не systemburo)
   ================================================================= */
:root{
  --st-bg:#0f1220; --st-panel:#171a2b; --st-panel-2:#1e2236; --st-line:#2a2f48;
  --st-text:#e7e9f3; --st-text-dim:#9aa0bd; --st-accent:#4F5BDF; --st-accent-2:#7c86ff;
  --st-good:#28a745; --st-warn:#ffc107; --st-bad:#dc3545;
  --st-radius:12px; --st-font:'Montserrat','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{ --st-bg:#eef0f7; --st-panel:#ffffff; --st-panel-2:#f4f5fb; --st-line:#e0e3f0;
         --st-text:#1c2033; --st-text-dim:#5a6180; }
}
:root[data-theme="dark"]{ --st-bg:#0f1220; --st-panel:#171a2b; --st-panel-2:#1e2236; --st-line:#2a2f48; --st-text:#e7e9f3; --st-text-dim:#9aa0bd; }
:root[data-theme="light"]{ --st-bg:#eef0f7; --st-panel:#ffffff; --st-panel-2:#f4f5fb; --st-line:#e0e3f0; --st-text:#1c2033; --st-text-dim:#5a6180; }

*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ background:var(--st-bg); color:var(--st-text); font-family:var(--st-font); -webkit-font-smoothing:antialiased; }

.studio{ display:grid; grid-template-columns:288px 1fr; grid-template-rows:auto 1fr; height:100vh; min-height:0; }
.st-top{ grid-column:1/3; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:12px 20px; background:var(--st-panel); border-bottom:1px solid var(--st-line); }
.st-brand{ display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px; }
.st-brand .dot{ width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--st-accent),var(--st-accent-2));
  display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800; }
.st-brand small{ display:block;font-weight:500;font-size:11px;color:var(--st-text-dim); letter-spacing:0; }
.st-spacer{ flex:1; }
.seg{ display:inline-flex; background:var(--st-panel-2); border:1px solid var(--st-line); border-radius:10px; padding:3px; gap:2px; }
.seg button{ appearance:none; border:0; background:transparent; color:var(--st-text-dim); font:inherit; font-size:13px; font-weight:600;
  padding:7px 12px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
.seg button:hover{ color:var(--st-text); }
.seg button[aria-pressed="true"]{ background:var(--st-accent); color:#fff; }
.seg button .w{ font-variant-numeric:tabular-nums; opacity:.85; font-weight:500; }
.st-label{ font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--st-text-dim); margin-right:2px; }

.st-nav{ background:var(--st-panel); border-right:1px solid var(--st-line); overflow-y:auto; padding:10px 0 40px; min-height:0; }
.st-group{ padding:14px 18px 4px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--st-text-dim); }
.st-item{ display:flex; align-items:baseline; gap:9px; width:100%; text-align:left; appearance:none; border:0; background:transparent;
  color:var(--st-text); font:inherit; font-size:13.5px; padding:8px 18px; cursor:pointer; border-left:3px solid transparent; }
.st-item:hover{ background:var(--st-panel-2); }
.st-item[aria-current="true"]{ background:var(--st-panel-2); border-left-color:var(--st-accent); font-weight:600; }
.st-item .k{ font-size:10px; font-weight:700; color:var(--st-accent-2); font-variant-numeric:tabular-nums; min-width:20px; }
.st-item .sub{ display:block; font-size:11px; color:var(--st-text-dim); font-weight:400; }

.st-stage{ overflow:auto; min-height:0; padding:26px; display:flex; flex-direction:column; align-items:center; gap:14px; }
.st-caption{ max-width:900px; text-align:center; }
.st-caption h2{ margin:0 0 4px; font-size:19px; }
.st-caption p{ margin:0; color:var(--st-text-dim); font-size:13.5px; line-height:1.5; }
.st-annot{ display:inline-flex; align-items:center; gap:8px; margin-top:10px; padding:7px 14px; border-radius:999px;
  font-size:12.5px; font-weight:600; border:1px solid var(--st-line); background:var(--st-panel); }
.st-annot.bad{ color:#ff8a95; border-color:#5a2730; background:#241318; }
.st-annot.good{ color:#7ee0a0; border-color:#1f4a30; background:#10241a; }
@media (prefers-color-scheme:light){ .st-annot.bad{color:#b02531;background:#fdeef0;border-color:#f6c9cf;} .st-annot.good{color:#1a7a3f;background:#eafaf0;border-color:#c3ecd1;} }

/* device frame */
.device-wrap{ display:flex; justify-content:center; width:100%; }
.device-outer{ transform-origin:top center; }
.device{ position:relative; background:var(--sb-bg,#f8f9ff); overflow:hidden;
  border:1px solid var(--st-line); box-shadow:0 24px 60px rgba(0,0,0,.35);
  container-type:inline-size; container-name:vp; }
.device.is-phone{ border-radius:26px; border:10px solid #0b0d18; box-shadow:0 24px 60px rgba(0,0,0,.45); }
.st-wtag{ position:absolute; z-index:60; top:8px; left:50%; transform:translateX(-50%);
  font-size:10.5px; font-weight:700; letter-spacing:.4px; color:#fff; background:rgba(15,18,32,.72);
  padding:3px 10px; border-radius:999px; pointer-events:none; }

/* =================================================================
   SYSTEMBURO DESIGN TOKENS (1:1 c проектом) — действуют ВНУТРИ .device
   ================================================================= */
.app{
  --color-primary:#4F5BDF; --color-primary-hover:#3d49c7; --color-primary-tint:rgba(79,91,223,.08);
  --color-success:#28a745; --color-danger:#dc3545; --color-warning:#ffc107;
  --color-text:#333; --color-text-muted:#999; --color-border:#e6e6e6;
  --color-bg:#f8f9ff; --color-bg-secondary:#f9f9f9;
  --radius-sm:8px; --radius-md:15px; --radius-lg:20px; --radius-xl:30px; --radius-pill:999px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04); --shadow-md:0 2px 8px rgba(15,23,42,.06);
  --gutter:20px;
  color:var(--color-text); background:var(--color-bg);
  font-family:'Montserrat','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  font-size:14px; line-height:1.4; min-height:100%;
}
.app *{ box-sizing:border-box; }

/* ---- app shell: nav rail + header + content ---- */
.app-shell{ display:grid; grid-template-columns:var(--rail-w,248px) 1fr; grid-template-rows:auto 1fr; min-height:640px; }
.rail{ grid-row:1/3; background:#fff; border-right:1px solid var(--color-border); display:flex; flex-direction:column; overflow:hidden; }
.rail-brand{ display:flex; align-items:center; gap:10px; padding:16px 16px 12px; font-weight:700; font-size:15px; }
.rail-brand .logo{ width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4F5BDF,#7c86ff);display:grid;place-items:center;color:#fff;font-weight:800; }
.rail-search{ margin:0 12px 8px; }
.rail-search input{ width:100%; padding:8px 12px; border:1px solid var(--color-border); border-radius:var(--radius-md); font:inherit; font-size:12.5px; }
.rail-scroll{ overflow-y:auto; padding:4px 0 14px; flex:1; }
.rail-sec{ padding:12px 16px 4px; font-size:9.5px; font-weight:700; letter-spacing:.6px; color:var(--color-text-muted); text-transform:uppercase; }
.rail-item{ display:flex; align-items:center; gap:11px; padding:9px 16px; margin:1px 8px; border-radius:12px; cursor:pointer; font-size:13.5px; color:#333; }
.rail-item .ic{ width:19px;height:19px;flex:none;border-radius:6px;background:var(--color-primary-tint);display:grid;place-items:center;font-size:11px;color:var(--color-primary); }
.rail-item:hover{ background:var(--color-bg); }
.rail-item.active{ background:var(--color-primary); color:#fff; }
.rail-item.active .ic{ background:rgba(255,255,255,.22); color:#fff; }
.rail-item .badge-n{ margin-left:auto; background:var(--color-danger); color:#fff; font-size:10px; font-weight:700; border-radius:999px; padding:1px 6px; }

.topbar{ grid-column:2; display:flex; align-items:center; gap:12px; padding:10px var(--gutter); background:#fff; border-bottom:1px solid var(--color-border); min-height:60px; }
.burger{ display:none; width:40px;height:40px;border:1px solid var(--color-border);border-radius:12px;background:#fff;cursor:pointer; align-items:center; justify-content:center; }
.burger span{ display:block; width:18px; height:2px; background:#333; box-shadow:0 -6px 0 #333, 0 6px 0 #333; }
.top-hello{ font-weight:600; font-size:14px; }
.top-hello small{ display:block; font-weight:400; font-size:11.5px; color:var(--color-text-muted); }
.top-actions{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.top-ic{ width:38px;height:38px;border-radius:12px;border:1px solid var(--color-border);background:#fff;display:grid;place-items:center;color:#555;font-size:15px;cursor:pointer; position:relative; }
.top-ic .dotb{ position:absolute; top:7px; right:8px; width:7px;height:7px;border-radius:50%;background:var(--color-danger); }
.top-more{ display:none; }
.clock{ font-variant-numeric:tabular-nums; font-size:13px; color:var(--color-text-muted); }

.content{ grid-column:2; padding:var(--gutter); overflow:auto; }
.content-inner{ max-width:1560px; margin:0 auto; }  /* потолок ширины (страховка) */

/* ---- systemburo components ---- */
.sb-card{ background:#fff; border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); }
.sb-h{ display:flex; align-items:center; justify-content:space-between; gap:12px; height:52px; padding:0 20px; border-bottom:1px solid var(--color-border); }
.sb-h h1{ font-size:17px; font-weight:600; margin:0; }
.sb-h .cnt{ font-size:12px; color:var(--color-text-muted); font-weight:500; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:8px 16px; border-radius:var(--radius-pill);
  border:1px solid transparent; background:#fff; color:#333; font:inherit; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; }
.btn--pri{ background:var(--color-primary); color:#fff; border-color:var(--color-primary); }
.btn--sec{ background:#fff; color:var(--color-primary); border-color:var(--color-primary); }
.btn--ghost{ background:#fff; color:#333; border-color:var(--color-border); }
.btn--sm{ padding:6px 12px; font-size:12px; }
.inp{ width:100%; padding:10px 14px; border:1px solid var(--color-border); border-radius:var(--radius-md); font:inherit; font-size:14px; background:#fff; }
.badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:600; line-height:1.4; white-space:nowrap; }
.b-blue{ background:var(--color-primary-tint); color:var(--color-primary); }
.b-green{ background:rgba(40,167,69,.12); color:#1e7e34; }
.b-red{ background:rgba(220,53,69,.12); color:#c0392b; }
.b-amber{ background:rgba(255,193,7,.16); color:#9a7d00; }
.b-grey{ background:#f0f0f4; color:#666; }
.status{ display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; font-size:12px; font-weight:600; }
.status .d{ width:7px;height:7px;border-radius:50%; }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; background:var(--color-bg); border:1px solid var(--color-border); font-size:12px; color:#444; }
.chip button{ border:0;background:transparent;cursor:pointer;color:#999;font-size:13px;line-height:1;padding:0; }

/* ---- toolbar (фильтры) ---- */
.toolbar{ display:flex; flex-direction:column; gap:10px; padding:14px 20px; border-bottom:1px solid var(--color-border); }
.toolbar-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.toolbar .search{ flex:1; min-width:180px; position:relative; }
.toolbar .search input{ padding-left:34px; }
.toolbar .search::before{ content:"⌕"; position:absolute; left:12px; top:8px; font-size:16px; color:#aaa; }
.filter-toggles{ display:flex; gap:6px; flex-wrap:wrap; }
.ftog{ padding:6px 12px; border:1px solid var(--color-border); border-radius:999px; background:#fff; font-size:12px; color:#555; cursor:pointer; }
.ftog.on{ background:var(--color-primary-tint); border-color:var(--color-primary); color:var(--color-primary); }
.mobile-filter-btn{ display:none; }

/* ---- data table (flex-строки, как в проекте) ---- */
.dt{ width:100%; }
.dt-head, .dt-row{ display:flex; gap:14px; align-items:center; padding:0 20px; }
.dt-head{ height:44px; border-bottom:1px solid var(--color-border); font-size:12px; font-weight:600; color:var(--color-text-muted); }
.dt-row{ min-height:56px; border-bottom:1px solid var(--color-border); cursor:pointer; }
.dt-row:hover{ background:var(--color-bg); }
.dt col, .dt .c{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.c-conf{ flex:150 1 0; min-width:132px; } .c-num{ flex:130 1 0; min-width:120px; } .c-date{ flex:120 1 0; min-width:120px; }
.c-org{ flex:220 1 0; min-width:150px; } .c-sender{ flex:150 1 0; min-width:120px; } .c-status{ flex:140 1 0; min-width:120px; }
.c-tags{ flex:170 1 0; min-width:120px; } .c-act{ flex:0 0 44px; text-align:right; }
.tag-wrap{ display:flex; gap:5px; flex-wrap:wrap; }
.dt-cardlist{ display:none; }

/* card version of a table row (mobile "письмо") */
.mcard{ position:relative; display:flex; flex-direction:column; gap:8px; padding:14px; border-bottom:1px solid var(--color-border); cursor:pointer; }
.mcard:hover{ background:var(--color-bg); }
.mcard .m-tags{ display:flex; gap:5px; flex-wrap:wrap; padding-right:120px; }
.mcard .m-org{ font-size:15px; font-weight:600; color:#1a1a1a; }
.mcard .m-meta{ font-size:12.5px; color:var(--color-text-muted); display:flex; gap:8px; flex-wrap:wrap; }
.mcard .m-meta .num{ color:var(--color-primary); font-weight:600; }
.mcard .m-foot{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--color-text-muted); }
.mcard .m-conf{ position:absolute; top:12px; right:12px; }

/* master-detail split */
.md-split{ display:grid; grid-template-columns:1fr; }
.md-split.with-detail{ grid-template-columns:1.35fr 1fr; }

.footer-total{ padding:12px 20px; font-size:12.5px; color:var(--color-text-muted); border-top:1px solid var(--color-border); }

/* ============================ RESPONSIVE (container queries на .device) ==== */
/* режим ПОСЛЕ: адаптивные правила. Порог планшета 900, телефона 620. */
.device[data-mode="after"] .app{ }

@container vp (max-width: 1100px){
  .device[data-mode="after"] .top-actions .clock,
  .device[data-mode="after"] .top-actions .hide-md{ display:none; }
  .device[data-mode="after"] .top-more{ display:grid; }
}
@container vp (max-width: 900px){
  .device[data-mode="after"] .app{ --rail-w:0px; --gutter:14px; }
  .device[data-mode="after"] .rail{ position:absolute; inset:0 auto 0 0; width:280px; z-index:80; transform:translateX(-100%); transition:transform .25s ease; box-shadow:0 0 40px rgba(0,0,0,.25); }
  .device[data-mode="after"] .app-shell.drawer-open .rail{ transform:none; }
  .device[data-mode="after"] .app-shell{ grid-template-columns:1fr; }
  .device[data-mode="after"] .topbar, .device[data-mode="after"] .content{ grid-column:1; }
  .device[data-mode="after"] .burger{ display:flex; }
  .device[data-mode="after"] .drawer-scrim{ display:block; }
  /* таблицы -> карточки */
  .device[data-mode="after"] .dt-head, .device[data-mode="after"] .dt-body{ display:none; }
  .device[data-mode="after"] .dt-cardlist{ display:block; }
  /* тулбар -> кнопка Фильтры */
  .device[data-mode="after"] .toolbar .desktop-filters{ display:none; }
  .device[data-mode="after"] .mobile-filter-btn{ display:inline-flex; }
  /* master-detail никогда не 2 колонки */
  .device[data-mode="after"] .md-split.with-detail{ grid-template-columns:1fr; }
}
@container vp (max-width: 620px){
  .device[data-mode="after"] .app{ --gutter:10px; }
  .device[data-mode="after"] .content{ padding:10px; }
  .device[data-mode="after"] .sb-h{ height:auto; flex-direction:column; align-items:stretch; gap:8px; padding:12px; }
  .device[data-mode="after"] .form-row-2, .device[data-mode="after"] .form-row-3{ grid-template-columns:1fr !important; }
}

/* режим ДО: как сейчас (нет max-width, таблицы уезжают в горизонтальный скролл) */
.device[data-mode="before"] .content-inner{ max-width:none; }
.device[data-mode="before"] .dt-scroll{ overflow-x:auto; }
@container vp (max-width: 900px){
  .device[data-mode="before"] .dt-head, .device[data-mode="before"] .dt-row, .device[data-mode="before"] .mcard-list-before{ min-width:840px; }
  .device[data-mode="before"] .burger{ display:flex; }
  .device[data-mode="before"] .app-shell{ grid-template-columns:1fr; }
  .device[data-mode="before"] .rail{ position:absolute; transform:translateX(-100%); width:280px; z-index:80; }
  .device[data-mode="before"] .app-shell.drawer-open .rail{ transform:none; }
  .device[data-mode="before"] .topbar,.device[data-mode="before"] .content{ grid-column:1; }
}
.drawer-scrim{ display:none; position:absolute; inset:0; background:rgba(0,0,0,.35); z-index:70; }
.app-shell.drawer-open .drawer-scrim{ display:block; }

/* full-page (login) */
.fullpage{ min-height:640px; display:grid; place-items:center; padding:20px;
  background:radial-gradient(1200px 600px at 70% -10%, rgba(79,91,223,.12), transparent), var(--color-bg); }
.login-card{ width:100%; max-width:400px; background:#fff; border:1px solid var(--color-border); border-radius:var(--radius-xl); padding:32px 28px; box-shadow:var(--shadow-md); }
.login-card .logo{ width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#4F5BDF,#7c86ff);margin:0 auto 16px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px; }
.login-card h2{ text-align:center; margin:0 0 4px; font-size:20px; }
.login-card p{ text-align:center; margin:0 0 22px; color:var(--color-text-muted); font-size:13px; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; color:#555; }

/* landing / dashboard helpers */
.grid-cards{ display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
.kpi{ padding:16px; } .kpi .v{ font-size:26px; font-weight:700; } .kpi .l{ font-size:12px; color:var(--color-text-muted); }
.spark{ height:44px; width:100%; }
.form-row-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-row-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.section-title{ font-size:13px; font-weight:700; color:#444; margin:18px 0 10px; }
.tabbar{ display:flex; gap:6px; border-bottom:1px solid var(--color-border); padding:0 20px; }
.tabbar .t{ padding:12px 14px; font-size:13px; font-weight:600; color:var(--color-text-muted); border-bottom:2px solid transparent; cursor:pointer; }
.tabbar .t.on{ color:var(--color-primary); border-bottom-color:var(--color-primary); }
</style>

</head>
<body>
<div class="studio" id="studio">
  <div class="st-top">
    <div class="st-brand"><span class="dot">S</span><span>systemburo<small>адаптивный интерфейс — интерактивный мокап</small></span></div>
    <div class="st-spacer"></div>
    <span class="st-label">Ширина</span>
    <div class="seg" id="segWidth">
      <button data-w="390"  aria-pressed="false">📱 Телефон <span class="w">390</span></button>
      <button data-w="768"  aria-pressed="false">📲 Планшет <span class="w">768</span></button>
      <button data-w="1440" aria-pressed="true">🖥 Десктоп <span class="w">1440</span></button>
      <button data-w="2560" aria-pressed="false">🖥 Широкий <span class="w">2560</span></button>
    </div>
    <span class="st-label">Вид</span>
    <div class="seg" id="segMode">
      <button data-m="after"  aria-pressed="true">Как будет</button>
      <button data-m="before" aria-pressed="false">Как сейчас</button>
    </div>
    <div class="seg" id="segTheme"><button id="themeBtn" aria-pressed="false">◐ Тема</button></div>
  </div>

  <nav class="st-nav" id="stNav" aria-label="Экраны"></nav>

  <div class="st-stage">
    <div class="st-caption" id="caption"></div>
    <div class="device-wrap">
      <div class="device-outer" id="deviceOuter">
        <div class="device" id="device" data-mode="after">
          <div class="st-wtag" id="wtag"></div>
          <div class="app" id="appRoot"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================ ДАННЫЕ ЭКРАНОВ ============================ */
const SCREENS = [

const R = {};

function shell(inner, opts={}){
  const nav = `
    <div class="rail">
      <div class="rail-brand"><span class="logo">Б</span><span>Бюропропусков</span></div>
      <div class="rail-search"><input placeholder="Поиск по меню…"></div>
      <div class="rail-scroll">
        <div class="rail-sec">Заявки</div>
        ${railItem("📥","Центр заявок",opts.active==="center","7")}
        ${railItem("✚","Новая заявка",opts.active==="create")}
        <div class="rail-sec">Управление данными</div>
        ${railItem("▦","Таблицы",false)}
        ${railItem("🚗","Автомобили",opts.active==="cars")}
        ${railItem("👥","Сотрудники",false)}
        <div class="rail-sec">Аналитика</div>
        ${railItem("📊","Аналитика",opts.active==="analytics")}
        <div class="rail-sec">Администрирование</div>
        ${railItem("⚙","Администрирование",opts.active==="admin")}
        <div class="rail-sec">Пользователь</div>
        ${railItem("📰","Обзор и новости",opts.active==="news")}
        ${railItem("👤","Личный кабинет",opts.active==="account")}
      </div>
    </div>`;
  const top = `
    <div class="topbar">
      <button class="burger" onclick="this.closest('.app-shell').classList.toggle('drawer-open')"><span></span></button>
      <div class="top-hello">Здравствуйте, Сергей<small>Бюро пропусков</small></div>
      <div class="top-actions">
        <span class="clock hide-md">10:24 · Пт, 11 июл</span>
        <button class="top-ic hide-md" title="Сообщить о проблеме">✉</button>
        <button class="top-ic" title="Уведомления">🔔<span class="dotb"></span></button>
        <button class="top-ic top-more" title="Ещё">⋯</button>
        <button class="btn btn--pri btn--sm">Подать заявку</button>
      </div>
    </div>`;
  return `<div class="app-shell" style="${opts.railW?`--rail-w:${opts.railW}`:''}">
      ${nav}${top}
      <div class="content"><div class="content-inner">${inner}</div></div>
      <div class="drawer-scrim" onclick="this.closest('.app-shell').classList.remove('drawer-open')"></div>
    </div>`;
}
function railItem(ic,label,active,badge){
  return `<div class="rail-item ${active?'active':''}"><span class="ic">${ic}</span><span>${label}</span>${badge?`<span class="badge-n">${badge}</span>`:''}</div>`;
}

/* ---- Dashboard ---- */
function spark(color){ let d="M0 30"; for(let i=1;i<=12;i++){ d+=` L${i*20} ${10+Math.round(20*Math.abs(Math.sin(i*1.3+color.length)))}`; }
  return `<svg class="spark" viewBox="0 0 240 44" preserveAspectRatio="none"><path d="${d} L240 44 L0 44 Z" fill="${hexA(color,.12)}"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2"/></svg>`; }
function bigChart(color){ const H=170,W=560; let d=`M0 ${H-20}`; const pts=[40,70,55,90,120,100,140,110,150,130,120,145];
  for(let i=0;i<pts.length;i++){ d+=` L${Math.round(i*(W/(pts.length-1)))} ${H-20-pts[i]}`; }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:170px;display:block">
    <g stroke="#eee" stroke-width="1">${[0,1,2,3].map(i=>`<line x1="0" x2="${W}" y1="${20+i*40}" y2="${20+i*40}"/>`).join('')}</g>
    <path d="${d} L${W} ${H} L0 ${H} Z" fill="${hexA(color,.10)}"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.5"/>
    <circle cx="${W}" cy="${H-20-pts[pts.length-1]}" r="4" fill="${color}"/></svg>`; }

/* ============================ КОНТРОЛЛЕР ============================ */
const state = { screen:"center", w:1440, mode:"after", theme:null };
const el = s=>document.querySelector(s);
const appRoot=el("#appRoot"), device=el("#device"), deviceOuter=el("#deviceOuter"),
      caption=el("#caption"), wtag=el("#wtag"), stNav=el("#stNav");

function findScreen(id){ for(const g of SCREENS){ const it=g.items.find(x=>x.id===id); if(it) return it; } }

function buildNav(){
  stNav.innerHTML = SCREENS.map(g=>`<div class="st-group">${g.g}</div>`+
    g.items.map(it=>`<button class="st-item" data-id="${it.id}"><span class="k">${it.id===state.screen?'●':'○'}</span><span><span>${it.n}</span></span></button>`).join('')
  ).join('');
  stNav.querySelectorAll('.st-item').forEach(b=>b.onclick=()=>{ state.screen=b.dataset.id; render(); });
  stNav.querySelectorAll('.st-item').forEach(b=> b.setAttribute('aria-current', b.dataset.id===state.screen));
}

function logicalWidth(){ return (state.w===2560 && state.mode==='after') ? 1440 : state.w; }

function render(){
  const sc = findScreen(state.screen);
  const renderer = R[sc.r] || (()=>`<div style="padding:40px">Экран «${sc.n}»</div>`);
  appRoot.innerHTML = renderer();
  device.dataset.mode = state.mode;
  const isPhone = state.w<=480;
  device.classList.toggle('is-phone', isPhone);

  const Lw = logicalWidth();
  const H = state.w<=480 ? 780 : state.w<=768 ? 720 : 820;
  device.style.width = Lw+'px';
  device.style.height = H+'px';

  // масштаб рамки под доступную ширину сцены
  const stage = el('.st-stage').clientWidth - 72;
  const scale = Math.min(1, stage / Lw);
  deviceOuter.style.transform = `scale(${scale})`;
  deviceOuter.style.height = (H*scale)+'px';
  deviceOuter.style.width = (Lw*scale)+'px';

  // подпись ширины
  if(state.w===2560 && state.mode==='after') wtag.textContent='2560px @100% → масштаб ×1.78 → выглядит как 1440';
  else if(state.w===2560) wtag.textContent='2560px @100% → без max-width: контент растянут, текст мелкий';
  else wtag.textContent=state.w+'px';

  // caption
  caption.innerHTML = `<h2>${sc.n}</h2><p>${sc.note}</p>` +
    (state.w===2560 ? `<div class="st-annot ${state.mode==='after'?'good':'bad'}">${state.mode==='after'?'✓ Весь UI масштабирован под эталон 1440 — крупно и читаемо':'✗ Сейчас: контент тянется на всю ширину, 14px-текст кажется мелким'}</div>`
      : (state.w<=768 ? `<div class="st-annot ${state.mode==='after'?'good':'bad'}">${state.mode==='after'?'✓ Таблицы → карточки, фильтры → лист снизу, меню → бургер':'✗ Сейчас: широкие таблицы уезжают в горизонтальный скролл'}</div>` : ``));

  buildNav();
}

// segmented controls
el('#segWidth').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  state.w=+b.dataset.w; el('#segWidth').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); render();
});
el('#segMode').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  state.mode=b.dataset.m; el('#segMode').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); render();
});
el('#themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next = cur==='dark'?'light':(cur==='light'?null: (matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark'));
  if(next) document.documentElement.setAttribute('data-theme',next); else document.documentElement.removeAttribute('data-theme');
};
addEventListener('resize', ()=>render());
render();
