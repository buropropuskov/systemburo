        type: string
      car_number:
        type: string
      company:
        type: string
      company_id:
        type: integer
      entry_date_to:
        type: string
      entry_time_from:
        type: string
      entry_time_to:
        type: string
      id:
        type: integer
      organization:
        type: string
      organization_id:
        type: integer
      status:
        type: integer
      target_tables:
        description: |-
          TargetTables - сами привязки «Проезд» с источником (#1227): карточка машины из
          контекста проходной различает «из заявки» (application) и «добавлено» (manual).
        items:
          $ref: '#/definitions/services.CarPassageTableRef'
        type: array
      target_tables_count:
        description: |-
          TargetTablesCount - число таблиц «Проезд», к которым привязана машина (#1194):
          FE показывает per-row «Убрать» без подменю при 1 (снятие с единственной =
          деактивация) и с подменю «из этой/из всех» при >1.
        type: integer
      territory_entry_time:
        type: string
      territory_status:
        type: integer
      unload_place:
        type: string
      unload_places:
        items:
          type: string
        type: array
    type: object
  services.TableEmployeeResponse:
    properties:
      application_id:
        type: integer
      application_number:
        type: string
      citizenship_name:
        type: string
      company:
        type: string
      entry_date_to:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      middle_name:
        type: string
      organization:
        type: string
      pass_places:
        type: string
      pass_time:
        type: string
      position:
        type: string
      status:
        type: integer
      target_tables:
        description: |-
          TargetTables - список привязок сотрудника к таблицам проходной с источником
          (#1227): application/manual. Карточка сотрудника из контекста проходной раньше
          видела только count - теперь получает и сам список для секции «Проезд».
        items:
          $ref: '#/definitions/services.EmployeePassageTableRef'
        type: array
      target_tables_count:
        description: |-
          TargetTablesCount - число таблиц проходной, к которым привязан сотрудник
          (employee_target_tables). Используется FE (#1194) для решения, показывать ли
          per-row выбор «из этой/из всех» при отвязке (>1) или сразу деактивировать (=1).
        type: integer
      territory_status:
        description: |-
          TerritoryStatus - территориальный статус сотрудника (0 - не отмечен, 1 - вошёл,
          2 - вышел) из той же колонки employees.territory_status, что читает
          /employees/history/current-status. Отдаём вместе со строкой, чтобы счётчик
          «Людей зашло» и кнопки входа/выхода были верны сразу, а не проваливались в
          «никто не отмечен» до ответа второго запроса.
        type: integer
    type: object
