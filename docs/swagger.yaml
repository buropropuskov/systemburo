  /search:
    get:
      description: |-
        Ищет по всем разделам, доступным пользователю, и возвращает результаты
        сгруппированными по сущностям. Раздел, на который у пользователя нет
        права, в выдачу не попадает; внутри раздела строки сужаются так же, как
        в его листинге. Ответ отдаётся даже если часть разделов не ответила --
        их коды перечислены в degraded.
      parameters:
      - description: Поисковый запрос, от 3 до 100 символов
        in: query
        name: q
        required: true
        type: string
      - description: Коды разделов через запятую; пусто -- все доступные
        in: query
        name: types
        type: string
      - description: Результатов на раздел, 1..20 (по умолчанию 5)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.SearchResponse'
        "400":
          description: Слишком короткий или длинный запрос, неизвестный раздел
          schema:
            $ref: '#/definitions/models.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.HTTPError'
        "403":
          description: Учётная запись заблокирована
          schema:
            $ref: '#/definitions/models.HTTPError'
        "503":
          description: Ни один раздел не ответил
          schema:
            $ref: '#/definitions/models.HTTPError'
      security:
      - BearerAuth: []
      summary: Сквозной поиск по системе
      tags:
      - search
