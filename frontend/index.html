<!DOCTYPE html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <script>
      // Тема до первого кадра (#1415): CSS грузится <link>-ом в <head>, поэтому
      // при выборе тёмной темы браузер успел бы отрисовать светлый фон, пока
      // подтянется бандл. Список id дублирует frontend/src/utils/theme.js -
      // дубль закреплён тестом src/utils/__tests__/theme.spec.js.
      (function () {
        try {
          var stored = localStorage.getItem('app-theme');
          var known = ['light', 'dark'];
          if (known.indexOf(stored) !== -1) {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {
          // localStorage недоступен - остаётся светлая из атрибута на <html>.
        }
      })();
    </script>
    <link rel="icon" href="/icon-192.png">
    <!-- PWA (#974): устанавливаемость нужна прежде всего iOS - Safari отдаёт Web
         Push только сайту, добавленному на экран "Домой" (display: standalone). -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#4F5BDF">
    <title>Бюро пропусков</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
