server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API routes - proxy to backend
    location ~ ^/(login|register|refresh-token|logout|user-data|users|user-types|user-types-management|applications|cars|employees|unique-cars|unique-employees|unload-places|organizations|companies|license-plate-formats|application-approvers|citizenships|system-tables|attachments|feedback|get-organization) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # Uploaded files
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
