server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ассеты с fingerprint в имени (index-<hash>.js, main-<hash>.css и т.п.)
    # кешируются агрессивно — при изменении контента имя меняется.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Сжимаем статические файлы; API не входит в эту location.
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types application/javascript text/javascript text/css;
        error_page 404 = @asset_not_found;
        try_files $uri =404;
    }

    location @asset_not_found {
        add_header Cache-Control "no-store" always;
        return 404;
    }
    # index.html не кешируется — иначе после deploy браузер продолжит
    # грузить старую версию, ссылающуюся на удалённый бандл.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # SPA fallback — все маршруты отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
