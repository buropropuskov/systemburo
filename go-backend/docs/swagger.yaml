host: localhost:8090
info:
  contact: {}
  description: API системы управления пропусками (Бюро пропусков)
  title: Systemburo API
  version: "1.0"
paths:
  /application-approvers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ApplicationApproverWithUser'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.HTTPError'
      security:
      - BearerAuth: []
      summary: Список утверждающих заявок
      tags:
      - application-approvers
    post:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.CreateApproverRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.HTTPError'
      security:
      - BearerAuth: []
      summary: Добавить утверждающего
      tags:
      - application-approvers
  /application-approvers/{id}:
    delete:
      parameters:
      - description: Approver ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.HTTPError'
      security:
      - BearerAuth: []
      summary: Удалить утверждающего
      tags:
      - application-approvers
  /application-approvers/available-users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AvailableApproverUser'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.HTTPError'
      security:
      - BearerAuth: []
      summary: Пользователи, доступные для назначения утверждающими
      tags:
      - application-approvers
  /applications:
    get:
      consumes:
      - application/json
      description: Возвращает заявки с фильтрацией. Принимающие видят все, обычные
        пользователи -- только свои.
      parameters:
      - description: Поисковый запрос
        in: query
        name: search_query
        type: string
      - description: ID организации
        in: query
        name: organization_id
        type: integer
      - description: ID компании
        in: query
        name: company_id
        type: integer
      - description: Статус согласования
        in: query
        name: confirmation
        type: string
      - description: Статус заявки
        in: query
        name: status
        type: string
      - description: Дата от (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Дата до (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.ApplicationWithDetails'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.HTTPError'
      security:
      - BearerAuth: []
      summary: Список заявок для Центра заявок
      tags:
      - applications
    post:
      consumes:
      - application/json
      description: Создаёт заявку с автоматическим назначением ответственных из организации/компании.
      parameters:
      - description: Данные заявки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/services.ApplicationCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.ApplicationCreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.HTTPError'
      security:
      - BearerAuth: []
      summary: Создание простой заявки
      tags:
      - applications
  /applications/{id}:
    get:
      description: Возвращает заявку с обновлением статуса при первом прочтении не
        отправителем.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.HTTPError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.HTTPError'
      security:
      - BearerAuth: []
      summary: Получение заявки по ID
      tags:
      - applications
    put:
      consumes:
      - application/json
      description: Обновляет confirmation, status и/или responsible_comment заявки.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      - description: Обновляемые поля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/services.ApplicationUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.ApplicationUpdateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.HTTPError'
      security:
      - BearerAuth: []
      summary: Обновление заявки
      tags:
      - applications
  /applications/{id}/approve:
    post:
      consumes:
      - application/json
      description: Пользователь голосует за согласование или отказ заявки.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      - description: 'Голос: approved или rejected'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/services.UserApprovalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: success + message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.HTTPError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.HTTPError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.HTTPError'
      security:
      - BearerAuth: []
      summary: Согласование заявки пользователем
      tags:
      - applications
  /applications/{id}/attachments:
    get:
      description: Возвращает вложения заявки с информацией из шаблонов (unique_attachments).
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/services.AttachmentInfo'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.HTTPError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.HTTPError'
      security:
      - BearerAuth: []
      summary: Вложения заявки
      tags:
      - applications
  /applications/{id}/check-approval-status:
    get:
      description: Возвращает текущие confirmation и status заявки.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.ApprovalStatusResponse'
        "401":
          description: Unauthorized
