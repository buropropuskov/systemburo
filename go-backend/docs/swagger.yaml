      company:
        type: string
      company_id:
        type: integer
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      middle_name:
        type: string
      organization:
        type: string
      organization_id:
        type: integer
      phone:
        type: string
      position:
        type: string
      type_id:
        type: integer
      user_type:
        type: string
      user_type_code:
        type: string
      username:
        type: string
    type: object
  models.HTTPError:
    properties:
      message:
        example: Error description
        type: string
    type: object
  models.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  models.LoginResponse:
    properties:
      company:
        type: string
      company_id:
        type: integer
      organization:
        type: string
      organization_id:
        type: integer
      refreshToken:
        type: string
      token:
        type: string
      type_id:
        type: integer
      user_type:
        type: string
    type: object
  models.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  models.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  models.RegisterRequest:
    properties:
      company_id:
        type: integer
      email:
