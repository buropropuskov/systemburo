upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:80;
}

# Rate-limit zone для /api/login (10 запросов/мин на IP). Это вторая линия защиты
# поверх per-user lockout и per-IP-limiter внутри Go-middleware: ловит burst-атаки
# и DDoS на уровне nginx до достижения backend-а.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Health check (мониторинг и readiness probe)
    location = /health {
        proxy_pass http://backend;
    }

    # Login - дополнительный rate-limit поверх backend-middleware (защита от
    # bypass через несколько вкладок/IP). burst=5 - принять короткий всплеск,
    # дальше 429.
    location = /api/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE real-time поток (#840): без буферизации и с долгим read-таймаутом, иначе
    # прокси копит поток в буфере и рвёт долгое соединение. Exact-match - только сам
    # стрим; POST /api/events/ticket идёт обычным путём через /api/ ниже.
    location = /api/events {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # API — всё под /api/ проксируется на backend (router.Setup использует api := e.Group("/api")).
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Swagger UI — на backend под /swagger/* (не мигрирован в /api)
    location /swagger/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Всё остальное → frontend (статика и SPA fallback, включая /news, /center, /new-application).
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    # HSTS: TLS terminates на внешнем уровне (VPS/Caddy), внутренний nginx работает
    # по HTTP - echo не может активировать HSTS сам. Ставим на уровне nginx. 2 года -
    # рекомендация OWASP для production. includeSubDomains + preload для max protection.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'self';" always;
}
