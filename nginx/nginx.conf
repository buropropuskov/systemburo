upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:80;
}

# Rate-limit zone для /api/login (10 запросов/мин на IP). Это вторая линия защиты
# поверх per-user lockout и per-IP-limiter внутри Go-middleware: ловит burst-атаки
# и DDoS на уровне nginx до достижения backend-а.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

# HTTP: только ACME-проверка и health, остальное уходит на HTTPS.
server {
    listen 80;
    server_name _;

    # Webroot для выпуска и продления сертификата через ACME (scripts/init-tls.sh acme).
    # Держим на 80: HTTP-01 challenge по протоколу ходит только сюда и редирект не любит.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Health check остаётся на HTTP: его дёргают деплой-скрипт и мониторинг с самого
    # хоста (http://localhost/health), где TLS не нужен, а редирект сломал бы проверку.
    location = /health {
        proxy_pass http://backend;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Сертификат кладёт scripts/init-tls.sh — в любом из трёх режимов (локальный УЦ
    # для внутренней сети, ACME при публичном домене, импорт готового) итоговые файлы
    # оказываются по этим путям. Конфигурация от режима не зависит.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling намеренно выключен: во внутреннем контуре сертификат подписан
    # локальным УЦ без OCSP-responder-а, и включённый stapling только сыпал бы
    # предупреждениями в лог. При переезде на публичный домен с ACME - включить.

    # Health check (мониторинг и readiness probe)
    location = /health {
        proxy_pass http://backend;
    }

    # Login - дополнительный rate-limit поверх backend-middleware (защита от
    # bypass через несколько вкладок/IP). burst=5 - принять короткий всплеск,
    # дальше 429.
    location = /api/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE real-time поток (#840): без буферизации и с долгим read-таймаутом, иначе
    # прокси копит поток в буфере и рвёт долгое соединение. Exact-match - только сам
    # стрим; POST /api/events/ticket идёт обычным путём через /api/ ниже.
    location = /api/events {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Выгрузка из файлового архива (#1615). ZIP собирается на лету и отдаётся потоком,
    # поэтому буферизацию надо снять: иначе nginx копит весь архив за период в памяти
    # и во временном файле прежде чем отдать первый байт, а на сервере 8 ГБ - выгрузка
    # за месяц кладёт машину. Потолок объёма сторожит само приложение
    # (archive.zip_max_bytes), здесь снимаем ограничение времени: сборка сотен файлов
    # законно идёт дольше минуты, и обрыв на середине оставил бы битый архив.
    # Exact-match на поток и на поштучный файл; список и оценка объёма идут обычным
    # путём через /api/ ниже.
    location = /api/file-archive/download {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/file-archive/files/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # API — всё под /api/ проксируется на backend (router.Setup использует api := e.Group("/api")).
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Swagger UI — на backend под /swagger/* (не мигрирован в /api)
    location /swagger/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Всё остальное → frontend (статика и SPA fallback, включая /news, /center, /new-application).
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Подстановка одноразового значения в разметку (#2353). Значение то же, что
        # уходит в заголовок политики ниже: $request_id уникален для запроса и
        # вычисляется один раз. Сжатие от апстрима отключено намеренно - фильтр
        # работает с текстом, а не с упакованным ответом. Страница не кешируется
        # (frontend/nginx.conf), поэтому браузер не получит разметку с чужим значением.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '__CSP_NONCE__' $request_id;
    }

    # Security headers
    # HSTS: 2 года - рекомендация OWASP для production. includeSubDomains + preload
    # для max protection. Важно для внутреннего контура: HSTS запрещает браузеру
    # click-through на недоверенном сертификате, поэтому корневой сертификат
    # локального УЦ обязан быть раскатан на рабочие станции (см. scripts/init-tls.sh).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'self';" always;
}
