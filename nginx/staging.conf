server_tokens off;

include /etc/nginx/proxy-trust.conf;

# Configure map hash sizing before any map is parsed.
include /etc/nginx/staging-auth.conf;

# The application bundles stylesheets and preserves formatted HTML attributes.
# pgAdmin has its own frontend. Keep its existing CSP while it is reviewed separately.
map $uri $staging_style_policy {
    default " style-src-elem 'self'; style-src-attr 'unsafe-inline';";
    ~^/pgadmin/ "";
}

map $uri $buro_log_service {
    default frontend;
    ~^/api/ api;
    /api/events events;
    ~^/assets/ assets;
    /health health;
    ~^/pgadmin/ admin_tool;
}

log_format buro_safe escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","service":"$buro_log_service",'
    '"method":"$request_method","status":$status,"duration":$request_time,'
    '"bytes":$body_bytes_sent,"upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time"}';



# Shared API envelope budget; independent of client IP / office NAT.
# 200 accepted SSE streams leave 56 slots for ordinary API requests.
map $uri $buro_api_budget_key {
    default "";
    ~^/api/ backend;
}
limit_conn_zone $buro_api_budget_key zone=buro_api_connections:1m;
# Additional admission for mutations; Go admits request bodies of every method.
map "$request_method:$uri" $buro_api_body_budget_key {
    default "";
    ~^(POST|PUT|PATCH):/api/ backend;
}
limit_conn_zone $buro_api_body_budget_key zone=buro_api_bodies:1m;
limit_req_zone $buro_api_budget_key zone=buro_api_requests:1m rate=200r/s;

upstream backend {
    server backend-edge:8080;
}

upstream frontend {
    server frontend:80;
}

# pgAdmin намеренно без upstream-блока: он поднимается по требованию (профиль
# tools в docker-compose.staging.yml), а имя из upstream nginx разрешает при
# старте и падает с «host not found in upstream», если контейнера нет. Адрес
# разрешается в момент запроса - см. location /pgadmin/ ниже.

# Cookie-based staging auth: после успешного Basic Auth выставляем cookie на 7
# дней, последующие запросы проходят без повторного prompt-а. Решает проблему
# Chromium incognito/hard-reload где basic auth cache сбрасывается при каждом
# F5. Совпало значение cookie -> auth_basic off; иначе требуем Basic Auth.
#
# Map-ы пишет entrypoint: случайный токен меняется при каждом старте контейнера.
# Cookie выдаётся только в защищённых locations после успешного ответа.
# Открытые health/API/SSE не выдают и не продлевают пропуск.


server {
    # Request diagnostics use the structured access log. Startup errors remain visible.
    error_log /dev/null;
    access_log /dev/stdout buro_safe;
    listen 80;
    server_name _;

    # These are process/edge admission ceilings, not a capacity guarantee.
    limit_conn buro_api_connections 256;
    limit_conn buro_api_bodies 8;
    limit_conn_status 503;
    limit_req zone=buro_api_requests burst=400 nodelay;
    limit_req_status 503;
    client_header_timeout 10s;
    client_body_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 30s;
    error_page 503 = @buro_api_busy;

    location @buro_api_busy {
        internal;
        default_type application/json;
        add_header Retry-After "2" always;
        add_header Cache-Control "no-store" always;
        return 503 '{"success":false,"error":"Сервис временно занят. Повтори запрос позже."}';
    }


    auth_basic $staging_realm;
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Health check (без basic auth — CI/CD и мониторинг)
    location = /health {
        auth_basic off;
        proxy_pass http://backend;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SSE real-time поток (#840): без буферизации и с долгим read-таймаутом, иначе
    # прокси копит поток в буфере и рвёт долгое соединение. Exact-match - только сам
    # стрим; POST /api/events/ticket идёт обычным путём через /api/ ниже.
    location = /api/events {
        auth_basic off;
        proxy_pass http://backend;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
    }

    # API — всё под /api/ без basic auth (JWT). router.Setup использует api := e.Group("/api").
    location /api/ {
        auth_basic off;
        proxy_pass http://backend;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_http_version 1.1;
        proxy_request_buffering off;
    }

    # Swagger UI - ослабленный CSP (нужен 'unsafe-inline' для script-src,
    # т.к. swagger-ui инициализируется через inline <script>).
    # Описание методов закрыто общим паролем стенда: auth_basic здесь наследуется
    # от server и снят намеренно не был (#2143). Прежде стояло auth_basic off, и
    # карта всех методов вместе с версией сборки доставалась любому желающему -
    # поблажка ничего не давала, пароль стенда и так есть у всех, кому он нужен.
    location /swagger/ {
        proxy_pass http://backend;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Content-Security-Policy;
        include /etc/nginx/staging-common-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; form-action 'self'; base-uri 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:" always;
        add_header Set-Cookie $staging_auth_set_cookie always;
    }

    # pgAdmin. Адрес разрешается в момент запроса, а не при старте nginx: контейнер
    # поднимается по требованию, и при его отсутствии сюда приходит 502 вместо
    # отказа всего сервера подняться. 127.0.0.11 - штатный DNS docker-сети.
    location /pgadmin/ {
        include /etc/nginx/staging-security-headers.conf;
        add_header Set-Cookie $staging_auth_set_cookie always;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $pgadmin_host pgadmin;
        proxy_pass http://$pgadmin_host:80/pgadmin/;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Хешированные файлы не требуют подстановки nonce в HTML.
    location ^~ /assets/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://frontend;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding $http_accept_encoding;
    }

    # SPA (включая /news, /center, /new-application и т.д. — теперь не конфликтуют с API)
    location / {
        include /etc/nginx/staging-security-headers.conf;
        add_header Set-Cookie $staging_auth_set_cookie always;
        proxy_pass http://frontend;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Подстановка одноразового значения в разметку (#2353), как в боевом конфиге.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '__CSP_NONCE__' $request_id;
    }

    # Security headers
    # HSTS: TLS terminates на внешнем уровне (VPS/Caddy), внутренний nginx работает
    # по HTTP - echo не может активировать HSTS сам. Ставим на уровне nginx. 2 года -
    # рекомендация OWASP для production. includeSubDomains + preload для max protection.
    include /etc/nginx/staging-security-headers.conf;
}
