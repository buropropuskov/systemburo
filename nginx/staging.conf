upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:80;
}

upstream pgadmin {
    server pgadmin:80;
}

# Cookie-based staging auth: после успешного Basic Auth выставляем cookie на 7
# дней, последующие запросы проходят без повторного prompt-а. Решает проблему
# Chromium incognito/hard-reload где basic auth cache сбрасывается при каждом
# F5. $cookie_staging_auth = "ok" -> auth_basic off; иначе требуем Basic Auth.
map $cookie_staging_auth $staging_realm {
    default "Staging";
    "ok"    off;
}

# Set-Cookie ставим только на не-401 ответах. На 401 (basic auth fail) cookie
# НЕ ставим - иначе любой с неправильным паролем получил бы cookie и обошёл auth.
map $status $staging_auth_set_cookie {
    "401"   "";
    default "staging_auth=ok; Path=/; Max-Age=604800; HttpOnly; Secure; SameSite=Strict";
}

server {
    listen 80;
    server_name _;

    auth_basic $staging_realm;
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Health check (без basic auth — CI/CD и мониторинг)
    location = /health {
        auth_basic off;
        proxy_pass http://backend;
    }

    # SSE real-time поток (#840): без буферизации и с долгим read-таймаутом, иначе
    # прокси копит поток в буфере и рвёт долгое соединение. Exact-match - только сам
    # стрим; POST /api/events/ticket идёт обычным путём через /api/ ниже.
    location = /api/events {
        auth_basic off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # API — всё под /api/ без basic auth (JWT). router.Setup использует api := e.Group("/api").
    location /api/ {
        auth_basic off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Swagger UI - ослабленный CSP (нужен 'unsafe-inline' для script-src,
    # т.к. swagger-ui инициализируется через inline <script>).
    location /swagger/ {
        auth_basic off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:" always;
    }

    # pgAdmin
    location /pgadmin/ {
        proxy_pass http://pgadmin/pgadmin/;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # SPA (включая /news, /center, /new-application и т.д. — теперь не конфликтуют с API)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    # HSTS: TLS terminates на внешнем уровне (VPS/Caddy), внутренний nginx работает
    # по HTTP - echo не может активировать HSTS сам. Ставим на уровне nginx. 2 года -
    # рекомендация OWASP для production. includeSubDomains + preload для max protection.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'self';" always;

    # Staging auth cookie (см. map выше). "always" - на всех статусах, map сам
    # фильтрует 401 в пустую строку (nginx игнорирует пустой Set-Cookie).
    add_header Set-Cookie $staging_auth_set_cookie always;
}
