upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:80;
}

upstream pgadmin {
    server pgadmin:80;
}

server {
    listen 80;
    server_name _;

    auth_basic "Staging";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Health check (без basic auth — CI/CD и мониторинг)
    location = /health {
        auth_basic off;
        proxy_pass http://backend;
    }

    # API — всё под /api/ без basic auth (JWT). router.Setup использует api := e.Group("/api").
    location /api/ {
        auth_basic off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Swagger UI
    location /swagger/ {
        auth_basic off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # pgAdmin
    location /pgadmin/ {
        proxy_pass http://pgadmin/pgadmin/;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # SPA (включая /news, /center, /new-application и т.д. — теперь не конфликтуют с API)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    # HSTS: TLS terminates на внешнем уровне (VPS/Caddy), внутренний nginx работает
    # по HTTP - echo не может активировать HSTS сам. Ставим на уровне nginx. 2 года -
    # рекомендация OWASP для production. includeSubDomains + preload для max protection.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'self';" always;
}
