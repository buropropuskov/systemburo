upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:80;
}

# pgAdmin намеренно без upstream-блока: он поднимается по требованию (профиль
# tools в docker-compose.staging.yml), а имя из upstream nginx разрешает при
# старте и падает с «host not found in upstream», если контейнера нет. Адрес
# разрешается в момент запроса - см. location /pgadmin/ ниже.

# Cookie-based staging auth: после успешного Basic Auth выставляем cookie на 7
# дней, последующие запросы проходят без повторного prompt-а. Решает проблему
# Chromium incognito/hard-reload где basic auth cache сбрасывается при каждом
# F5. Совпало значение cookie -> auth_basic off; иначе требуем Basic Auth.
#
# Map-ы пишет entrypoint: случайный токен меняется при каждом старте контейнера.
# Cookie выдаётся только в защищённых locations после успешного ответа.
# Открытые health/API/SSE не выдают и не продлевают пропуск.
include /etc/nginx/staging-auth.conf;

server {
    listen 80;
    server_name _;

    auth_basic $staging_realm;
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Health check (без basic auth — CI/CD и мониторинг)
    location = /health {
        auth_basic off;
        proxy_pass http://backend;
    }

    # SSE real-time поток (#840): без буферизации и с долгим read-таймаутом, иначе
    # прокси копит поток в буфере и рвёт долгое соединение. Exact-match - только сам
    # стрим; POST /api/events/ticket идёт обычным путём через /api/ ниже.
    location = /api/events {
        auth_basic off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # API — всё под /api/ без basic auth (JWT). router.Setup использует api := e.Group("/api").
    location /api/ {
        auth_basic off;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Swagger UI - ослабленный CSP (нужен 'unsafe-inline' для script-src,
    # т.к. swagger-ui инициализируется через inline <script>).
    # Описание методов закрыто общим паролем стенда: auth_basic здесь наследуется
    # от server и снят намеренно не был (#2143). Прежде стояло auth_basic off, и
    # карта всех методов вместе с версией сборки доставалась любому желающему -
    # поблажка ничего не давала, пароль стенда и так есть у всех, кому он нужен.
    location /swagger/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
        include /etc/nginx/staging-common-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:" always;
        add_header Set-Cookie $staging_auth_set_cookie always;
    }

    # pgAdmin. Адрес разрешается в момент запроса, а не при старте nginx: контейнер
    # поднимается по требованию, и при его отсутствии сюда приходит 502 вместо
    # отказа всего сервера подняться. 127.0.0.11 - штатный DNS docker-сети.
    location /pgadmin/ {
        include /etc/nginx/staging-security-headers.conf;
        add_header Set-Cookie $staging_auth_set_cookie always;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $pgadmin_host pgadmin;
        proxy_pass http://$pgadmin_host:80/pgadmin/;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # SPA (включая /news, /center, /new-application и т.д. — теперь не конфликтуют с API)
    location / {
        include /etc/nginx/staging-security-headers.conf;
        add_header Set-Cookie $staging_auth_set_cookie always;
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Подстановка одноразового значения в разметку (#2353), как в боевом конфиге.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '__CSP_NONCE__' $request_id;
    }

    # Security headers
    # HSTS: TLS terminates на внешнем уровне (VPS/Caddy), внутренний nginx работает
    # по HTTP - echo не может активировать HSTS сам. Ставим на уровне nginx. 2 года -
    # рекомендация OWASP для production. includeSubDomains + preload для max protection.
    include /etc/nginx/staging-security-headers.conf;
}
