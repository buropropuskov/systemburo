# ── Подключение ──────────────────────────────────────────────────────────────
bot:
  # Токен от @BotFather
  token: ''
  # Id группы (у супергрупп отрицательный, начинается с -100)
  chatId: 0
  # Номер топика. Если топиков нет, поставь -1
  threadId: -1
  # Адрес API. Можно заменить на свой релей, если Telegram недоступен напрямую
  apiBase: 'https://api.telegram.org'

# ── Поведение при обрывах ────────────────────────────────────────────────────
queue:
  # Сообщения из игры старше этого возраста не досылаются (секунды)
  maxAgeSeconds: 600
  # Сообщения из Telegram старше этого возраста в игру не попадают (секунды).
  # Защищает от того, что Telegram придержал обновления во время обрыва связи
  maxIncomingAgeSeconds: 120
  # Сколько сообщений держим в очереди
  maxSize: 200
  # Паузы между повторами (секунды), последняя повторяется бесконечно
  backoffSeconds: [2, 5, 10, 30, 60]

# ── Что отправлять в Telegram ────────────────────────────────────────────────
events:
  chat: true
  join: true
  quit: true
  death: true
  serverStart: true
  serverStop: true

# ── Команды из Telegram ──────────────────────────────────────────────────────
commands:
  online: true
  tps: true

# ── Форматы сообщений в Telegram ─────────────────────────────────────────────
telegramFormats:
  chat: '[MC] {name}: {message}'
  join: '{name} зашёл на сервер'
  quit: '{name} вышел с сервера'
  death: '{message}'
  serverStart: 'Сервер включен.'
  serverRestart: 'Сервер перезагружен.'
  serverStop: 'Сервер выключен.'
  # Через сколько секунд после остановки повторный запуск считается перезагрузкой
  restartWindowSeconds: 300

# ── Формат сообщений в игре (MiniMessage) ────────────────────────────────────
minecraftFormat: '<blue>[Telegram]</blue> <white>{name}</white>: {message}'

# ── Как показывать вложения из Telegram ──────────────────────────────────────
incoming:
  sticker: '[стикер {emoji}]'
  photo: '[фото]'
  video: '[видео]'
  voice: '[голосовое]'
  animation: '[гиф]'
  document: '[файл]'

# ── Реакции на сообщения ─────────────────────────────────────────────────────
# Работают, только если бот администратор группы: иначе Telegram их не присылает
reactions:
  enabled: true
  minecraftFormat: '<blue>[Telegram]</blue> <white>{name}</white> отреагировал: {emoji} на «{quote}»'
  # Чем подписывать реакцию кастомным эмодзи из набора Premium
  customEmojiLabel: 'своим эмодзи'
  # Чем подписывать реакцию на сообщение, которого нет в памяти плагина
  unknownQuote: 'сообщение'
  # До скольки символов сокращать цитату
  quoteLength: 40

# ── Названия эмодзи ──────────────────────────────────────────────────────────
