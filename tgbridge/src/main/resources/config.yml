# ── Подключение ──────────────────────────────────────────────────────────────
bot:
  # Токен от @BotFather
  token: ''
  # Id группы (у супергрупп отрицательный, начинается с -100)
  chatId: 0
  # Топик для переписки. Если топиков нет, поставь -1
  threadId: -1
  # Топик для служебного: входы, выходы, смерти, старт и предупреждения.
  # Оставь -1, чтобы всё шло в общий топик
  systemThreadId: -1
  # Адрес API. Можно заменить на свой релей, если Telegram недоступен напрямую
  apiBase: 'https://api.telegram.org'

# ── Поведение при обрывах ────────────────────────────────────────────────────
queue:
  # Сообщения из игры старше этого возраста не досылаются (секунды)
  maxAgeSeconds: 600
  # Сообщения из Telegram старше этого возраста в игру не попадают (секунды)
  maxIncomingAgeSeconds: 120
  # Сколько сообщений держим в очереди
  maxSize: 200
  # Паузы между повторами (секунды), последняя повторяется бесконечно
  backoffSeconds: [2, 5, 10, 30, 60]
  # Сколько ждать перед отправкой, чтобы соседние события слиплись в одно сообщение (мс)
  batchWindowMillis: 700
  # Сколько событий максимум склеивать в одно сообщение
  batchMaxMessages: 8

# ── Что отправлять в Telegram ────────────────────────────────────────────────
events:
  chat: true
  join: true
  quit: true
  death: true
  serverStart: true
  serverStop: true
  # Отказы во входе: сканеры и попытки зайти чужим ником
  loginDenied: true

# ── Команды из Telegram ──────────────────────────────────────────────────────
commands:
  online: true
  tps: true
  status: true
  map: true
  # Ссылка, которую бот пришлёт по команде /map
  mapUrl: ''

# ── Форматы сообщений в Telegram ─────────────────────────────────────────────
telegramFormats:
  chat: '[MC] {name}: {message}'
  join: '{name} зашёл на сервер'
  quit: '{name} вышел с сервера'
  death: '{message}'
  serverStart: 'Сервер включен.'
  serverRestart: 'Сервер перезагружен.'
  serverStop: 'Сервер выключен.'
  loginDenied: 'Отклонён вход: {name} ({reason})'
  # Через сколько секунд после остановки повторный запуск считается перезагрузкой
  restartWindowSeconds: 300

# ── Формат сообщений в игре (MiniMessage) ────────────────────────────────────
minecraftFormat: '<blue>[Telegram]</blue> <white>{name}</white>: {message}'
# Делать ссылки из Telegram кликабельными в игровом чате
clickableLinks: true

# ── Понятные имена вместо юзернеймов ─────────────────────────────────────────
# Слева - username в Telegram, справа - как показывать в игре
names: {}
#  mousse_landyshka: Ландыш
#  ilooonly: Алёна

# ── Предупреждения о состоянии сервера ───────────────────────────────────────
alerts:
  tps:
    enabled: true
    # Порог, ниже которого сервер считается тормозящим
    below: 15.0
    # Сколько секунд подряд TPS должен быть низким, чтобы пришло сообщение
    forSeconds: 30
    # Не повторять предупреждение чаще, чем раз в столько минут
    cooldownMinutes: 15
    message: 'Сервер тормозит: TPS {tps}, тик {mspt} мс'
  disk:
    enabled: true
    # Предупреждать, когда свободного места меньше этого (ГБ)
    freeGb: 2.0
    everyMinutes: 60
    message: 'Мало места на диске: свободно {free} ГБ'
