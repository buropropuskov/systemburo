<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>

  <!-- Сеть организации -->
  <rect x="40" y="30" width="300" height="150" rx="4" fill="#f7f7f7" stroke="#333333" stroke-width="1.5"/>
  <text x="190" y="58" text-anchor="middle" font-size="16" fill="#111111">Сеть организации</text>
  <text x="190" y="84" text-anchor="middle" font-size="13" fill="#555555">рабочие места заявителей,</text>
  <text x="190" y="104" text-anchor="middle" font-size="13" fill="#555555">бюро пропусков,</text>
  <text x="190" y="124" text-anchor="middle" font-size="13" fill="#555555">постов охраны</text>
  <text x="190" y="152" text-anchor="middle" font-size="12" fill="#777777">корневой сертификат</text>
  <text x="190" y="169" text-anchor="middle" font-size="12" fill="#777777">установлен в доверенные</text>

  <path d="M 340 90 L 430 90" stroke="#333333" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="385" y="80" text-anchor="middle" font-size="13" fill="#333333">443</text>
  <path d="M 340 130 L 430 130" stroke="#999999" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="385" y="150" text-anchor="middle" font-size="13" fill="#666666">80</text>

  <!-- Сервер -->
  <rect x="430" y="30" width="530" height="530" rx="6" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="450" y="56" font-size="14" fill="#111111">Сервер приложения</text>

  <!-- Опубликованные порты -->
  <rect x="452" y="72" width="486" height="128" rx="4" fill="#e8e8e8" stroke="#333333" stroke-width="1.4"/>
  <text x="695" y="98" text-anchor="middle" font-size="15" fill="#111111">Обратный прокси nginx</text>
  <text x="695" y="122" text-anchor="middle" font-size="13" fill="#333333">443 - весь рабочий трафик по HTTPS</text>
  <text x="695" y="144" text-anchor="middle" font-size="13" fill="#333333">80 - только проверка сертификата</text>
  <text x="695" y="164" text-anchor="middle" font-size="13" fill="#333333">и проверка состояния, остальное перенаправляется</text>
  <text x="695" y="188" text-anchor="middle" font-size="12" fill="#777777">единственные порты, открытые наружу</text>

  <line x1="695" y1="200" x2="695" y2="248" stroke="#333333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Внутренняя сеть -->
  <rect x="452" y="254" width="486" height="286" rx="4" fill="none" stroke="#999999" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="470" y="278" font-size="13" fill="#777777">Внутренняя сеть контейнеров: порты наружу не публикуются</text>

  <rect x="478" y="296" width="434" height="62" rx="4" fill="#f7f7f7" stroke="#333333" stroke-width="1.3"/>
  <text x="695" y="320" text-anchor="middle" font-size="14" fill="#111111">Прикладной сервер, порт 8080</text>
  <text x="695" y="342" text-anchor="middle" font-size="12" fill="#666666">проверка прав, бизнес-логика, выгрузки</text>

  <rect x="478" y="372" width="434" height="62" rx="4" fill="#f7f7f7" stroke="#333333" stroke-width="1.3"/>
  <text x="695" y="396" text-anchor="middle" font-size="14" fill="#111111">Веб-приложение, порт 80</text>
  <text x="695" y="418" text-anchor="middle" font-size="12" fill="#666666">собранная статика интерфейса</text>

  <rect x="478" y="448" width="434" height="74" rx="4" fill="#eeeeee" stroke="#333333" stroke-width="1.3"/>
  <text x="695" y="472" text-anchor="middle" font-size="14" fill="#111111">База данных, порт 5432</text>
  <text x="695" y="494" text-anchor="middle" font-size="12" fill="#666666">доступна только прикладному серверу,</text>
  <text x="695" y="512" text-anchor="middle" font-size="12" fill="#666666">с рабочих мест недостижима</text>

  <!-- Пояснение слева снизу -->
  <rect x="40" y="230" width="300" height="200" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/>
  <text x="60" y="258" font-size="14" fill="#111111">Правила межсетевого экрана</text>
  <text x="60" y="286" font-size="13" fill="#555555">Разрешить входящие:</text>
  <text x="60" y="308" font-size="13" fill="#333333">443/tcp - работа с системой</text>
  <text x="60" y="330" font-size="13" fill="#333333">80/tcp - выпуск сертификата</text>
  <text x="60" y="352" font-size="13" fill="#333333">22/tcp - управление сервером,</text>
  <text x="60" y="370" font-size="13" fill="#333333">только с адресов подразделения</text>
  <text x="60" y="398" font-size="13" fill="#555555">Закрыть извне: 5432, 8080,</text>
  <text x="60" y="416" font-size="13" fill="#555555">8081, 8082</text>
</svg>
